# Plenix login · how the Plenix VM's Nginx would use the login service (services/login). An example to merge into the site
# file /etc/nginx/sites-available/plenix at the cutover (README.md "Cutover"); not installed. Nginx Proxy Manager (10.0.0.20)
# keeps TLS and sends both hosts to this Nginx on port 80; at the cutover its Authentik advanced config (hosts 27 and 28,
# services/auth/npm-advanced-config.mjs) is removed, and this file does the checking instead.
#   every page:   auth_request /auth/check  ->  204 and the X-Plenix-* headers, or 401 -> /auth/sign-in?rd=<the page>
#   /auth/:       the login service itself (sign-in page, sign-out, session), open
#   /cdn/:        open on the design-system host (other sites load the Platform from it; so does the sign-in page)
# The X-Plenix-* headers sent to a service are always set here (from the check), never passed on from the visitor, and the
# X-authentik-* headers are emptied, so no visitor can claim to be someone.

# the visitor's address: NPM sends it in X-Real-IP; trusted from NPM only
set_real_ip_from 10.0.0.20;
real_ip_header   X-Real-IP;

upstream plenix_login { server 127.0.0.1:8782; keepalive 8; }
upstream plenix_save  { server 127.0.0.1:8781; }

