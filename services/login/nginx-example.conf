# ---- plenix.lighthouseway.org: every app signs in ----
server {
    listen 80;
    server_name plenix.lighthouseway.org;
    root /srv/plenix/www;
    # only the proxy reaches this Nginx (as today)
    allow 10.0.0.20;
    deny  all;

    include snippets/plenix-login.conf;

    location / {
        auth_request /_plenix_check;
        error_page   401 = @plx_sign_in;
        # (the site's existing rules for / stay here: the redirect to /Plenix/dashboard/, try_files, caching)
        try_files $uri $uri/ =404;
    }
}

# ---- design-system.lighthouseway.org: private, except /cdn/ (and /api/v1/, as today) ----
server {
    listen 80;
    server_name design-system.lighthouseway.org;
    root /srv/plenix/www;
    allow 10.0.0.20;
    deny  all;

    include snippets/plenix-login.conf;

    # the Platform release files: open to every site, as today (the existing CORS and caching rules stay)
    location /cdn/    { alias /srv/plenix/cdn/; }
    location /api/v1/ { alias /srv/plenix/api/v1/; }

    # Save: the design system's Edit dialog. The check's headers go to the save service; Authentik's are emptied.
    location = /api/tokens {
        auth_request     /_plenix_check;
        error_page       401 = @plx_signed_out;
        auth_request_set $plx_user   $upstream_http_x_plenix_user;
        auth_request_set $plx_email  $upstream_http_x_plenix_email;
        auth_request_set $plx_name   $upstream_http_x_plenix_name;
        auth_request_set $plx_groups $upstream_http_x_plenix_groups;
        proxy_set_header X-Plenix-User   $plx_user;
        proxy_set_header X-Plenix-Email  $plx_email;
        proxy_set_header X-Plenix-Name   $plx_name;
        proxy_set_header X-Plenix-Groups $plx_groups;
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-email    "";
        proxy_set_header X-authentik-groups   "";
        proxy_set_header Host $host;
        client_max_body_size 64k;
        proxy_read_timeout   300s;
        proxy_pass http://plenix_save;
    }
    location = /api/session {
        auth_request     /_plenix_check;
        error_page       401 = @plx_signed_out;
        auth_request_set $plx_user   $upstream_http_x_plenix_user;
        auth_request_set $plx_email  $upstream_http_x_plenix_email;
        auth_request_set $plx_groups $upstream_http_x_plenix_groups;
        proxy_set_header X-Plenix-User   $plx_user;
        proxy_set_header X-Plenix-Email  $plx_email;
        proxy_set_header X-Plenix-Groups $plx_groups;
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-email    "";
        proxy_set_header X-authentik-groups   "";
        proxy_pass http://plenix_save;
    }
    # the design system's "Sign in" link (spec.js: /api/signin?rd=<page>): the sign-in page
    location = /api/signin { return 302 /auth/sign-in?rd=$arg_rd; }

    # every page of the design system
    location / {
        auth_request /_plenix_check;
        error_page   401 = @plx_sign_in;
        # (the existing rules: the redirect to /Plenix/platform/design-system/, the one-stylesheet bundle, caching)
        try_files $uri $uri/ =404;
    }
}
