# Plenix package registry · the VM's Nginx site for registry.lighthouseway.org (installed by the owner-approved step in
# README.md, once the DNS record exists). Nginx Proxy Manager terminates HTTPS and forwards to the VM on port 80.
server {
    listen 80;
    server_name registry.lighthouseway.org;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:4873;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
