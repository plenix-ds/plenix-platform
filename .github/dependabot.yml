# Dependency watch (issue 696, audit finding #684). Dependabot opens a pull request for a new version of an npm package and of a
# GitHub Action, once a week. It reads package.json and the workflows only: the libraries copied into platform/vendor/ (React,
# Tiptap, PDF.js, ECharts) are not npm dependencies, so they are not watched here (see platform/vendor/README.md).
# It uses GitHub's own token; nothing is stored. Settings are not changed by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
