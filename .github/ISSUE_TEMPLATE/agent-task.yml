name: Agent task
description: One task for one coding agent (Codex or Claude): one issue, one branch, one pull request (AGENTS.md).
title: "Task: "
labels: ["agent-task"]
body:
  - type: dropdown
    id: agent
    attributes:
      label: Owner
      description: The agent that owns this task. Add the matching label (agent:codex or agent:claude).
      options: [Codex, Claude]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What to build or fix, and why. For a library lane, the wave and lane (plan.md) and its targets.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files you own
      description: Every file the task may create or change. Design-system files go under lanes/<task>/design-system/ (AGENTS.md). Anything else is out of bounds.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done means
      description: The checks that must pass and what the pull request must show.
      value: |
        - The quick gates pass: lane-overlay, build-app.js, check-system.js (SYSTEM_OK), check-spec.js (SPEC_OK).
        - No generated file in the branch (CI: GENERATED_OK).
        - The browser tests pass in CI on the pull request.
        - The pull request lists anything left undone and what needs the owner.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Read first
      description: Briefs, examples and decisions that apply.
