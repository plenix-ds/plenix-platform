name: Component proposal
description: Propose a new component, variant, pattern or token for Plenix (stage 1 of CONTRIBUTING.md).
title: "Proposal: "
labels: ["proposal"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: The canonical name, as the UI Inventory would list it.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options: [Component, Variant of an existing component, Composite, Pattern, Page structure, Token or foundation, Implementation detail]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: For the person using the product. Why the existing items do not solve it.
    validations:
      required: true
  - type: textarea
    id: search
    attributes:
      label: What you searched
      description: The inventory names and aliases you checked, and the closest existing items.
    validations:
      required: true
  - type: textarea
    id: anatomy
    attributes:
      label: Anatomy and behavior
      description: Its parts, states, keyboard and focus behavior, how it adapts to narrow space.
  - type: textarea
    id: systems
    attributes:
      label: In other design systems
      description: Its name in Carbon, Atlassian, Material 3, Fluent 2, Polaris or Spectrum, if any.
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Numbered options, the recommendation first.
