# Plenix full suite: the final gate (owner, 2026-10-13), run by hand (Actions › Full suite › Run workflow) only when
# everything is marked complete; never per push and never per release. Every test on every page (TEST_SCOPE=full), split
# into parallel jobs, each with a time limit. The browser tests open the St. John the Beloved test site (plenix-ds/st-john-test-site) and
# the suite applications, never the design spec (owner, 2026-10-25); the design system (platform/design-system) is checked
# out with the DS_TOKEN secret for the spec check in the build job only.
name: Full suite

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CHROME_PATH: /usr/bin/google-chrome
  TEST_SCOPE: full

jobs:
  checks:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Design system (submodule)
        env:
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
        run: |
          if [ -n "$DS_TOKEN" ]; then
            git config --global url."https://x-access-token:${DS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --depth 1
          else
            echo "::warning::DS_TOKEN is not set: the design system is not tested, so this is not a full run"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build, system and spec checks, release build
        run: |
          node build-app.js
          node build-usage.js
          node check-system.js
          if [ -f platform/design-system/inventory.js ]; then node check-spec.js; fi
          node build-packages.js

      - name: "Tests without a browser (formats, brand rules, login, types)"
        run: node tests/run.js formats brand-rules login types

  browser:
    name: Full ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the St. John the Beloved test site and the suite applications (owner, 2026-10-25: never the design spec)
          - { name: pages, tests: pages, shard: '' }
          - { name: 'component tokens', tests: component-tokens, shard: '' }
          - { name: typography, tests: typography, shard: '' }
          - { name: reflow, tests: reflow, shard: '' }
          - { name: fixtures, tests: site-coverage visual layout utilities keyboard charts-echarts-353 sparkline-echarts-353, shard: '' }
          - { name: behavior, tests: data-grid focus-order semantic-html navigation one-primary, shard: '' }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stjohn
          POSTGRES_USER: stjohn
          POSTGRES_PASSWORD: stjohn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stjohn -d stjohn" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SITE_DIR: ${{ github.workspace }}/st-john-test-site
      SITE_DATABASE_URL: postgres://stjohn:stjohn@localhost:5432/stjohn
      TEST_SHARD: ${{ matrix.shard }}
      TEST_TIMEOUT_MS: '5400000'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The St. John test site (its own repository; DS_TOKEN reads it)
        uses: actions/checkout@v5
        with:
          repository: plenix-ds/st-john-test-site
          # the site's revision, pinned (#382 F8): the same Platform commit always meets the same site. Bump it here and
          # in the other workflow (ci.yml, full.yml) when the site changes, in the pull request that needs the change
          ref: e9a3c7471e7c997a61de50ea81404e1a96bbad3c
          token: ${{ secrets.DS_TOKEN }}
          path: st-john-test-site

      - name: The site's packages and build
        working-directory: st-john-test-site
        run: |
          npm ci --no-audit --no-fund
          node build.js

      - name: Build
        run: |
          node build-app.js
          node build-usage.js
          node build-packages.js

      - name: Tests (${{ matrix.tests }}), every page
        run: node tests/run.js --full ${{ matrix.tests }}
