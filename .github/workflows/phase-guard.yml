# The phase guard (owner decision: start it). It runs .github/phase-guard/phase-guard.js. The labels are in
# .github/phase-guard/labels.json. The repository variables are TEAM_PHASE (build | qa, set by the Tech Lead), BUILD_TOOL
# (claude | codex: the tool of the build phase) and QA_ACCOUNTS (the GitHub accounts the QA role uses, comma-separated).
# To make every merge wait for QA, add the status check "qa-passed" to the protection of DEFAULT_BRANCH; add "ux-queued" too so a
# UX pull request waits until the Tech Lead or the Developer takes its ux-queued label off.
# It uses only the token GitHub gives each run (no stored key).
name: phase-guard
on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, closed]
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
concurrency:
  group: phase-guard-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  guard:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issues' && startsWith(github.event.label.name, 'phase:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/phase-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the phase change
        run: node .github/phase-guard/phase-guard.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_PHASE: ${{ vars.TEAM_PHASE }}
          BUILD_TOOL: ${{ vars.BUILD_TOOL }}
          QA_ACCOUNTS: ${{ vars.QA_ACCOUNTS }}
