# Plenix release: builds the Platform and publishes the four packages (@plenix-ds/tokens, icons, styles, react) to
# GitHub Packages. Runs when a version tag is pushed (v0.1.0, v0.2.0 …); the tag must match "version" in package.json.
# The CDN files and the JSON API are published to design-system.lighthouseway.org by deploy.sh.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@plenix-ds'

      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

      - run: npm ci

      - name: Build and check
        run: |
          node build-app.js
          node check-system.js
          node check-style.js
          node build-packages.js
          node check-bundle.js

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for p in tokens icons styles react; do
            (cd packages/$p && npm publish)
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the release notes: this version's section of CHANGELOG.md, then where to get it
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          printf '\n---\nPackages: @plenix-ds/tokens, icons, styles, react %s · CDN: https://design-system.lighthouseway.org/cdn/%s/ · API: https://design-system.lighthouseway.org/api/v1/\n' "$v" "$v" >> notes.md
          gh release create "${GITHUB_REF_NAME}" --title "Plenix ${GITHUB_REF_NAME}" --notes-file notes.md
