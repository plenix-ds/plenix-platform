# Plenix release: builds the Platform and publishes the four packages (@plenix-ds/tokens, icons, styles, react) to
# GitHub Packages. Runs when a version tag is pushed (v0.1.0, v0.2.0 …); the tag must match "version" in package.json.
# The CDN files and the JSON API are published to design-system.lighthouseway.org by deploy.sh.
# Run by hand (workflow_dispatch, input "tag"): publishes a tag that was pushed earlier but never published. That run takes
# this workflow file and tools/check-live-cdn.js from the branch it is started on, and builds and publishes exactly the
# tag's tree: the checkout is the tag, the tag must still match its package.json, and a tag that already has a GitHub
# release is refused.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The version tag to publish, for example v0.74.0 (its tree is built and published)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  issues: read

# one run per tag at a time: a hand run never races the tag's own run
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # the tag this run publishes: the pushed tag, or the "tag" input of a hand run (never the branch a hand run starts on)
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: A version tag, not yet released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "\"$TAG\" is not a version tag (v<major>.<minor>.<patch>)"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG already has a GitHub release"; exit 1; fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: The checkout is the tag's tree
        run: |
          want=$(git rev-parse "refs/tags/$TAG^{commit}") && have=$(git rev-parse HEAD)
          [ "$want" = "$have" ] || { echo "Checked out $have, but $TAG is $want"; exit 1; }
          echo "Publishing $TAG at $have"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@plenix-ds'

      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG does not match package.json version $v"; exit 1; }

      - run: npm ci

      - name: Build and check
        run: |
          node build-app.js
          node check-system.js
          node check-style.js
          node build-packages.js
          node check-bundle.js

      # the owner's readiness rule (readiness-27): no release while an issue labeled priority:1 is open (read-only; red stops the release)
      - name: Readiness, no open priority:1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check-readiness.js "$GITHUB_REPOSITORY"

      # the live-CDN check from this workflow's own commit (on a tag push that is the tag; on a hand run, the branch's fixed
      # check), so an older tag is checked by the bounded check, not by the full crawl its tree may still carry
      - name: The live-CDN check from this workflow's commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: tools/check-live-cdn.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # the owner's live-CDN rule (cdn-live-27): the CDN serves the files this release built (deploy.sh runs before the tag, so it is
      # live now); red stops the npm publish. Bounded: the records, the archive, the top files and a sample, with a 15-minute deadline
      - name: Live CDN matches this build
        timeout-minutes: 20
        run: |
          v=$(node -p "require('./package.json').version")
          node .release-tools/tools/check-live-cdn.js "$v" --dir "release/cdn/$v"

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for p in tokens icons styles react; do
            (cd packages/$p && npm publish)
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${TAG#v}"
          # the release notes: this version's section of CHANGELOG.md, then where to get it
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          printf '\n---\nPackages: @plenix-ds/tokens, icons, styles, react %s · CDN: https://design-system.lighthouseway.org/cdn/%s/ · API: https://design-system.lighthouseway.org/api/v1/\n' "$v" "$v" >> notes.md
          gh release create "$TAG" --verify-tag --title "Plenix $TAG" --notes-file notes.md
