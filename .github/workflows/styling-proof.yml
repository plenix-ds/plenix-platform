# Plenix styling proof (Styling Standard, section 13; owner 2026-10-19: proofs in CI, only the touched components).
# Run by hand or by `gh workflow run styling-proof.yml -f head=<branch> -f ds=<routes> -f apps=<pages>`:
# for every design-system route named (one parallel job each) and for the application pages named (one job), the
# runner builds the base and the head, records the base's computed styles with tests/clash-audit.js, and checks the
# head against them on the same machine (so the comparison is exact). A job fails on any changed element; a page whose
# documentation changes with the stylesheet is reported as DIFFERS and checked before and after the differing stretch.
name: Styling proof

on:
  workflow_dispatch:
    inputs:
      head:
        description: 'The branch (or commit) to prove'
        required: true
      base:
        description: 'What it is compared with'
        default: main
      ds:
        description: 'Design-system routes, comma separated (e.g. overlays/teaching-bubble,actions/button); empty: none'
        default: ''
      apps:
        description: 'Application pages, comma separated names (e.g. dashboard,dam); empty: none'
        default: ''

permissions:
  contents: read

env:
  CHROME_PATH: /usr/bin/google-chrome
  TEST_TIMEOUT_MS: '5400000'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      routes: ${{ steps.r.outputs.routes }}
    steps:
      - id: r
        env:
          DS: ${{ inputs.ds }}
          APPS: ${{ inputs.apps }}
        run: |
          node -e '
            const ds = (process.env.DS || "").split(",").map((s) => s.trim()).filter(Boolean).map((r) => ({ kind: "ds", pages: r }));
            const apps = (process.env.APPS || "").trim() ? [{ kind: "apps", pages: process.env.APPS.trim() }] : [];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "routes=" + JSON.stringify(ds.concat(apps)) + "\n");'

  proof:
    needs: plan
    if: needs.plan.outputs.routes != '[]'
    name: ${{ matrix.kind }} ${{ matrix.pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.routes) }}
    steps:
      - name: Token for the design system (private submodule)
        env:
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
        run: |
          if [ -z "$DS_TOKEN" ]; then echo "::error::DS_TOKEN is not set: the design system cannot be checked out"; exit 1; fi
          git config --global url."https://x-access-token:${DS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.head }}', path: head, persist-credentials: false }
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.base }}', path: base, persist-credentials: false }
      # the design system with DS_TOKEN (checkout's own token cannot read the private repository)
      - name: Design system (submodule) in both
        run: |
          (cd head && git submodule update --init --depth 1)
          (cd base && git submodule update --init --depth 1)

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: head/package-lock.json }

      - name: Install and build both
        run: |
          (cd head && npm ci && node build-app.js >/dev/null)
          ln -s "$PWD/head/node_modules" base/node_modules
          (cd base && node build-app.js >/dev/null)
          # the audit is the head's (the base may predate a change to the tool)
          cp head/tests/clash-audit.js base/tests/clash-audit.js

      - name: Base (record)
        run: |
          cd base
          if [ "${{ matrix.kind }}" = ds ]; then node tests/clash-audit.js --ds --pages "${{ matrix.pages }}"; else node tests/clash-audit.js --pages "${{ matrix.pages }}"; fi
          cp tests/baselines/clashes*.json tests/baselines/computed*.json ../head/tests/baselines/

      - name: Head (check)
        run: |
          cd head
          if [ "${{ matrix.kind }}" = ds ]; then node tests/clash-audit.js --ds --check --pages "${{ matrix.pages }}" | tee ../proof.txt; else node tests/clash-audit.js --check --pages "${{ matrix.pages }}" | tee ../proof.txt; fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ strategy.job-index }}
          path: proof.txt
          if-no-files-found: ignore
