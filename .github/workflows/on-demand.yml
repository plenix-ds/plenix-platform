# Plenix on-demand tests (owner, 2026-10-25: "Reserve only for as on demand test by owner and take out from the tests"):
# accessibility, high contrast, color contrast, themes and density. They never run on a push, a pull request or in the
# full suite; the owner starts them by hand: Actions › On-demand tests › Run workflow. Scope "full" checks every page
# of the apps and the St. John the Beloved test site; "changed" checks only what changed since the last commit.
name: On-demand tests

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full: every page; changed: only what changed'
        type: choice
        options: [full, changed]
        default: full

permissions:
  contents: read

env:
  CHROME_PATH: /usr/bin/google-chrome
  TEST_SCOPE: ${{ inputs.scope }}

jobs:
  contrast:
    name: Color contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Color contrast (no browser)
        run: node tests/run.js contrast

  browser:
    name: On demand ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: accessibility, tests: a11y, shard: '' }
          - { name: 'high contrast, themes and density', tests: high-contrast theme density, shard: '' }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stjohn
          POSTGRES_USER: stjohn
          POSTGRES_PASSWORD: stjohn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stjohn -d stjohn" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SITE_DIR: ${{ github.workspace }}/st-john-test-site
      SITE_DATABASE_URL: postgres://stjohn:stjohn@localhost:5432/stjohn
      TEST_SHARD: ${{ matrix.shard }}
      TEST_TIMEOUT_MS: '5400000'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The St. John test site (its own repository; DS_TOKEN reads it)
        uses: actions/checkout@v5
        with:
          repository: plenix-ds/st-john-test-site
          token: ${{ secrets.DS_TOKEN }}
          path: st-john-test-site

      - name: The site's packages and build
        working-directory: st-john-test-site
        run: |
          npm ci --no-audit --no-fund
          node build.js

      - name: Build
        run: |
          node build-app.js
          node build-usage.js
          node build-packages.js

      - name: Tests (${{ matrix.tests }})
        run: node tests/run.js ${{ matrix.tests }}
