# Plenix checks: on every push and pull request, only the checks for what changed (owner, 2026-10-13: the full suite runs
# only as the manual final gate, full.yml; a per-push run of everything took almost two hours). The build job: build, the
# system and spec checks, the release build and the tests without a browser. The browser tests run in changed mode
# (tests/changed.js: the push's before-SHA, or the pull request's base, to this commit) in parallel jobs, each its own
# checkout and build (the build takes seconds, faster than passing it on as an artifact), each with a time limit.
# The design system (platform/design-system) is a private submodule: with the DS_TOKEN secret (a token that can read
# plenix-ds/plenix-design-system) it is checked out and tested too; without it, the apps and the Platform are tested.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CHROME_PATH: /usr/bin/google-chrome
  TEST_SCOPE: changed
  # what to compare with: the pull request's base, or the commit before the push (zeros for a new branch: tests/changed.js
  # then compares with where the branch left main)
  CHANGED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  build:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Design system (submodule)
        env:
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
        run: |
          if [ -n "$DS_TOKEN" ]; then
            git config --global url."https://x-access-token:${DS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --depth 1
            echo "Design system checked out"
          else
            echo "::notice::DS_TOKEN is not set: the design system's pages and spec check are skipped"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          node build-app.js
          node build-usage.js

      - name: System check
        run: node check-system.js

      - name: Spec check
        run: |
          if [ -f platform/design-system/inventory.js ]; then node check-spec.js; else echo "skipped: no design system"; fi

      - name: Release build
        run: node build-packages.js

      - name: What changed (the scope of the browser tests)
        run: node tests/changed.js

      - name: "Tests without a browser (contrast, formats, brand rules, login)"
        run: node tests/run.js contrast formats brand-rules login

  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pages
            tests: pages
          - name: accessibility
            tests: a11y
          - name: typography
            tests: typography
          - name: targets and reflow
            tests: targets reflow
          # the labs in three parts: a change to a shared component reaches many labs (0.31.52 ran out of time in one job)
          - name: labs 1 of 3
            tests: labs
            shard: 1/3
          - name: labs 2 of 3
            tests: labs
            shard: 2/3
          - name: labs 3 of 3
            tests: labs
            shard: 3/3
          - name: fixtures
            tests: visual density layout theme
          - name: behavior
            tests: data-table keyboard high-contrast focus-order semantic-html utilities navigation
    env:
      TEST_TIMEOUT_MS: '1200000'
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Design system (submodule)
        env:
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
        run: |
          if [ -n "$DS_TOKEN" ]; then
            git config --global url."https://x-access-token:${DS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --depth 1
          else
            echo "::notice::DS_TOKEN is not set: the design system's pages are skipped"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          node build-app.js
          node build-usage.js

      - name: Tests (${{ matrix.tests }}), changed mode
        run: node tests/run.js ${{ matrix.tests }}
