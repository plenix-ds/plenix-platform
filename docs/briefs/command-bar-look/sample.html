<!doctype html>
<html lang="en" data-plx-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons sample</title>
<!-- The sample photographed for the PR 3 before/after (#298): the real Platform components, nothing restyled here. -->
<script src="../../../platform/providers/theme-boot.js"></script>
<link rel="stylesheet" href="../../../platform/system/fonts.css">
<link rel="stylesheet" href="../../../platform/platform.css">
<link rel="stylesheet" href="../review.css">
<script src="../../../platform/vendor/react-loader.js"></script>
<script src="../../../platform/dist/platform.js"></script>
<script src="../../../platform/engines/plenix-engines.js"></script>
<style>
.bf-row{align-items:center;display:flex;flex-wrap:wrap;gap:var(--plx-sys-space-inline-sm);}
.bf-states{align-items:center;display:grid;gap:var(--plx-sys-space-stack-xs) var(--plx-sys-space-inline-sm);grid-template-columns:repeat(6, max-content);}
.bf-label{color:var(--plx-sys-content-muted);font-size:var(--plx-ref-font-size-12);margin:0;}
.bf-bar{min-block-size:var(--plx-ref-size-220px,13.75rem);}
.bf-field{max-inline-size:var(--plx-ref-size-320px,20rem);}
.bf-menu{min-block-size:var(--plx-ref-size-160px,10rem);}
</style>
</head>
<body class="rv-page">
<div id="root"></div>
<script>
(function () {
  const h = React.createElement, P = window.Plenix, noop = () => {};
  const B = (props, label) => h(P.Button, Object.assign({ onClick: noop }, props), label);
  const row = (variant, name) => [h('p', { key: name, className: 'bf-label' }, name),
    B({ key: 'r', variant }, 'Rest'), B({ key: 'h', variant, className: 'is-hover', icon: 'edit' }, 'Hover'), B({ key: 'p', variant, className: 'is-pointer-down' }, 'Pressed'),
    variant === 'primary' ? h('span', { key: 's' }) : B({ key: 's', variant, selected: true }, 'Selected'), B({ key: 'd', variant, disabled: true }, 'Disabled')];
  ReactDOM.createRoot(document.getElementById('root')).render(h('main', { className: 'rv-doc' },
    h('section', { className: 'rv-stage', id: 'buttons' },
      h('div', { className: 'bf-states' }, h('span'), ['Rest', 'Hover', 'Pressed', 'Selected', 'Disabled'].map((t) => h('p', { key: t, className: 'bf-label' }, t)),
        row('primary', 'Primary'), row('secondary', 'Default'), row('ghost', 'Subtle')),
      h('div', { className: 'bf-row' }, B({ iconOnly: true, icon: 'reply', label: 'Reply' }), B({ iconOnly: true, icon: 'forward', label: 'Forward' }),
        B({ iconOnly: true, icon: 'archive', label: 'Archive' }), B({ iconOnly: true, icon: 'more', label: 'More actions' }),
        B({ icon: 'star', pressed: false }, 'Favorite'), B({ icon: 'star', pressed: true }, 'Favorite'), B({ caret: true, icon: 'sort' }, 'Sort'),
        h(P.SplitButton, { variant: 'primary', icon: 'save', label: 'Save', onClick: noop }, h(P.MenuItem, { onSelect: noop }, 'Save a copy')),
        h(P.ButtonGroup, { label: 'Transfer' }, B({}, 'Import'), B({}, 'Export'))),
      h('div', { className: 'bf-field' }, h(P.Field, { label: 'Name' }, h(P.Input, { defaultValue: 'Website relaunch' })))),
    // the other controls that share the control corner (radius-control): a form row, a nav list and a menu
    h('section', { className: 'rv-stage', id: 'controls' },
      h('div', { className: 'bf-row' },
        h('div', { className: 'bf-field' }, h(P.Field, { label: 'Title' }, h(P.Input, { defaultValue: 'Quarterly report' }))),
        h('div', { className: 'bf-field' }, h(P.Field, { label: 'Format' }, h(P.Select, { defaultValue: 'pdf', options: [{ value: 'pdf', label: 'PDF' }, { value: 'docx', label: 'Word' }] }))),
        h('div', { className: 'bf-field' }, h(P.Field, { label: 'Owner' }, h(P.Combobox, { label: 'Owner', value: 'mc', onChange: noop, options: [{ value: 'mc', label: 'Maya Chen' }, { value: 'jt', label: 'Jeff Torres' }] })))),
      h('div', { className: 'bf-row' },
        h('div', { className: 'bf-field' }, h(P.NavList, { label: 'Folders', value: 'inbox', onSelect: noop, items: [{ id: 'inbox', label: 'Inbox', icon: 'mail' }, { id: 'archive', label: 'Archive', icon: 'archive' }, { id: 'shared', label: 'Shared', icon: 'share' }] })),
        h('div', { className: 'bf-menu', id: 'menu' }, h(P.Menu, { label: 'Actions', trigger: B({ caret: true }, 'Actions') },
          h(P.MenuItem, { icon: 'edit', onSelect: noop }, 'Rename'), h(P.MenuItem, { icon: 'copy', onSelect: noop }, 'Duplicate'), h(P.MenuItem, { icon: 'trash', danger: true, onSelect: noop }, 'Delete'))))),
    h('section', { className: 'bf-bar', id: 'bar' },
      h(P.CommandBar, { label: 'Documents', count: '24 documents', position: 'static',
        actions: [{ id: 'new', label: 'New', icon: 'plus', items: [{ id: 'doc', label: 'Document', icon: 'edit', onSelect: noop }, { id: 'folder', label: 'Folder', icon: 'folder-add', onSelect: noop }] },
          { id: 'upload', label: 'Upload', icon: 'upload', onSelect: noop }, { id: 'pin', label: 'Pin', icon: 'pin', toggle: true, pressed: true, onSelect: noop },
          { id: 'delete', label: 'Delete', icon: 'trash', danger: true, onSelect: noop }] }))));
})();
</script>
</body>
</html>
