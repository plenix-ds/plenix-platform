<!doctype html>
<html lang="en" data-plx-theme="default" data-plx-mode="light" data-plx-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header facts: your combination</title>
<link rel="stylesheet" href="../../../platform/system/fonts.css">
<link rel="stylesheet" href="../../../platform/platform.css">
<style>
/* A study page (not Platform code): the owner's combination: Presiding as its icon tile; the two counts as big numbers with
   their identifying icon and their own add action inside the tile (the separate buttons go). Plenix tokens and Buttons only. */
body{background:var(--plx-sys-surface-canvas);color:var(--plx-sys-content-default);font-family:var(--plx-sys-text-body-font-family);margin:0;padding:var(--plx-sys-space-layout-md);}
h1{font-size:var(--plx-sys-text-heading-font-size);margin:0 0 var(--plx-sys-space-stack-lg);}
.v{margin-block-end:var(--plx-sys-space-layout-md);}
.v h2{font-size:var(--plx-sys-text-label-font-size);font-weight:var(--plx-sys-text-label-font-weight);margin:0 0 var(--plx-sys-space-stack-xs);}
.v p.note{color:var(--plx-sys-content-subtle);font-size:var(--plx-sys-text-caption-font-size);margin:var(--plx-sys-space-stack-xs) 0 0;max-inline-size:var(--plx-ref-size-900px);}
.hdr{background:var(--plx-sys-surface-default);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-card-12px);display:grid;gap:var(--plx-sys-space-layout-sm);grid-template-columns:1.7fr 1fr;max-inline-size:var(--plx-ref-size-900px);padding:var(--plx-sys-space-inset-lg);}
.main{display:flex;flex-direction:column;gap:var(--plx-sys-space-stack-sm);}
.head{align-items:center;display:flex;gap:var(--plx-sys-space-inline-md);}
.tile{align-items:center;background:var(--plx-sys-surface-canvas);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-surface-8px);color:var(--plx-sys-action-primary-background);display:flex;block-size:var(--plx-ref-size-44px);inline-size:var(--plx-ref-size-44px);justify-content:center;}
.tile .plx-icon{--plx-comp-icon-size:var(--plx-ref-size-24px);}
.title{font-size:var(--plx-ref-font-size-18);font-weight:var(--plx-sys-font-weight-medium);}
.sub{color:var(--plx-sys-content-muted);}
.rule{background:var(--plx-sys-action-primary-background);block-size:var(--plx-sys-border-width-thick);}
.aside{align-items:flex-end;border-inline-start:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-divider);display:flex;flex-direction:column;gap:var(--plx-sys-space-stack-sm);justify-content:space-between;padding-inline-start:var(--plx-sys-space-inset-lg);}
.seg{border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-default);border-radius:var(--plx-sys-radius-control-4px);display:inline-flex;font-size:var(--plx-sys-text-caption-font-size);overflow:hidden;}
.seg span{white-space:nowrap;padding:var(--plx-sys-space-inset-xs) var(--plx-sys-space-inset-sm);}
.seg span+span{border-inline-start:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-default);}
.seg .on{background:var(--plx-sys-data-color-blue-soft);color:var(--plx-sys-data-color-blue-on-soft);}
.mono{font-family:var(--plx-sys-text-mono-font-family);word-spacing:var(--plx-sys-text-mono-word-spacing);}
.lbl{color:var(--plx-sys-content-muted);font-size:var(--plx-sys-text-caption-font-size);white-space:nowrap;}
.val{font-size:var(--plx-ref-font-size-15);font-weight:var(--plx-sys-font-weight-semibold);white-space:nowrap;}
.big{font-size:var(--plx-ref-font-size-24);font-weight:var(--plx-sys-font-weight-semibold);line-height:var(--plx-ref-line-height-tight);}
.row{align-items:stretch;display:flex;gap:var(--plx-sys-space-inline-sm);}
/* the fact tile (your Presiding look): a canvas box, a tinted icon square, label over value */
.f{align-items:center;background:var(--plx-sys-surface-canvas);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-surface-8px);display:flex;gap:var(--plx-sys-space-inline-sm);padding:var(--plx-sys-space-inset-sm);}
.ib{align-items:center;background:var(--plx-sys-surface-default);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-detail-4px);color:var(--plx-sys-content-muted);display:flex;flex-shrink:0;block-size:var(--plx-ref-size-32px);inline-size:var(--plx-ref-size-32px);justify-content:center;}
.ib .plx-icon{--plx-comp-icon-size:var(--plx-ref-size-16px);}
.ib.blue{background:var(--plx-sys-data-color-blue-soft);border-color:var(--plx-sys-data-color-blue-soft);color:var(--plx-sys-data-color-blue-on-soft);}
.cnt{display:flex;flex-direction:column;}
/* placement 1: + at the tile's top end */
.p1 .f.count{align-items:flex-start;}
.p1 .f.count .cnt{flex-grow:1;}
/* placement 2: a labeled action at the tile's foot */
.p2 .f.count{align-items:stretch;flex-direction:column;}
.p2 .top{align-items:center;display:flex;gap:var(--plx-sys-space-inline-sm);}
/* placement 3: the action beside the number, centered */
.p3 .f.count .cnt{margin-inline-end:var(--plx-sys-space-inline-md);}
</style>
</head>
<body>
<h1>Session header: your combination, three places for the add action</h1>
<div id="out"></div>
<script>
// a study page: Presiding as shown; the counts big, with their icon and their own add action
var I = function (n) { return '<span class="plx-icon plx-icon--' + n + '" aria-hidden="true"></span>'; };
var plusBtn = function (label) { return '<button type="button" class="plx-button plx-button--ghost plx-button--size-xs plx-button--icon-only" aria-label="' + label + '" title="' + label + '"><span class="plx-button__icon">' + I('add') + '</span></button>'; };
var textBtn = function (label) { return '<button type="button" class="plx-button plx-button--secondary plx-button--size-xs"><span class="plx-button__icon">' + I('add') + '</span><span class="plx-button__label">' + label + '</span></button>'; };
var presiding = '<div class="f"><span class="ib">' + I('person') + '</span><div><div class="lbl">Presiding</div><div class="val">H.E. Metropolitan Serapion</div></div></div>';
var count = function (p, icon, n, label, action) {
  if (p === 'p2') return '<div class="f count"><div class="top"><span class="ib blue">' + I(icon) + '</span><div class="cnt"><div class="big mono">' + n + '</div><div class="lbl">' + label + '</div></div></div>' + textBtn(action) + '</div>';
  if (p === 'p3') return '<div class="f count"><span class="ib blue">' + I(icon) + '</span><div class="cnt"><div class="big mono">' + n + '</div><div class="lbl">' + label + '</div></div>' + plusBtn(action) + '</div>';
  return '<div class="f count"><span class="ib blue">' + I(icon) + '</span><div class="cnt"><div class="big mono">' + n + '</div><div class="lbl">' + label + '</div></div>' + plusBtn(action) + '</div>';
};
var V = [
  ['p1', '1 · A small + at the top end of each count', 'The add button sits in the tile\'s corner (its tooltip and name say what it adds). Quietest; the number stays the focus.'],
  ['p2', '2 · A labeled button at the foot of each count', 'Each tile ends with its own action in words: "Assign case", "Schedule hearing". Clearest to a first-time user; the tiles get taller.'],
  ['p3', '3 · The + beside the number, centered', 'Number, then the add button on the same line. Compact like 1, with the action easier to reach.']
];
var out = document.getElementById('out');
V.forEach(function (v) {
  var s = document.createElement('section'); s.className = 'v ' + v[0];
  s.innerHTML = '<h2>' + v[1] + '</h2><div class="hdr"><div class="main">'
    + '<div class="head"><span class="tile">' + I('calendar') + '</span><div><div class="title">Council Session 2026-10-22</div><div class="sub">Thursday, October 22, 2026 at 10:00 AM</div></div></div>'
    + '<div class="rule"></div><div class="row">' + presiding
    + count(v[0], 'folder', 10, 'Cases to assign', v[0] === 'p2' ? 'Assign case' : 'Assign a case')
    + count(v[0], 'calendar', 10, 'Scheduled for hearing', v[0] === 'p2' ? 'Schedule hearing' : 'Schedule a hearing') + '</div></div>'
    + '<div class="aside"><button type="button" class="plx-button plx-button--secondary plx-button--size-sm"><span class="plx-button__icon">' + I('person') + '</span><span class="plx-button__label">Council Attendance</span></button>'
    + '<span class="seg"><span>Draft</span><span class="on">In progress</span><span>Adjourned</span></span></div></div>'
    + '<p class="note">' + v[2] + ' The two separate buttons ("Case to be Assigned", "Case to Hearings") are gone; Council Attendance stays.</p>';
  out.appendChild(s);
});
</script>
</body>
</html>
