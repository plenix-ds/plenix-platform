<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header style 2: the real component</title>
<script src="../../../platform/providers/theme-boot.js"></script>
<link rel="stylesheet" href="../../../platform/system/fonts.css">
<link rel="stylesheet" href="../../../platform/platform.css">
<script src="../../../platform/vendor/react-loader.js"></script>
<script src="../../../platform/dist/platform.js"></script>
<style>
/* a review page (not Platform code): the real EntityHeader, header style 2 and a style 1 header for the new title */
body{background:var(--plx-sys-surface-canvas);font-family:var(--plx-sys-text-body-font-family);margin:0;padding:var(--plx-sys-space-layout-md);}
h1,h2{color:var(--plx-sys-content-default);font-size:var(--plx-sys-text-label-font-size);margin:var(--plx-sys-space-stack-lg) 0 var(--plx-sys-space-stack-xs);}
</style>
</head>
<body>
<div id="root"></div>
<script>
// the real component, rendered live: header style 2 with its status box, then a style 1 header
(function () {
  var P = window.Plenix, R = window.React, h = R.createElement;
  function Demo() {
    var st = R.useState('in-progress');
    var states = { value: st[0], onChange: st[1], options: [{ value: 'draft', label: 'Draft', icon: 'pencil', tone: 'waiting' }, { value: 'in-progress', label: 'In progress', icon: 'clock', tone: 'success' }, { value: 'adjourned', label: 'Adjourned', icon: 'do-not-disturb', tone: 'negative' }] };
    var noop = function () {};
    return h('div', null,
      h('h1', null, 'Header style 2: the fact boxes carry their actions'),
      h(P.EntityHeader, { headingLevel: 2, title: 'Council Session 2026-10-22', subtitle: 'Thursday, October 22, 2026 at 10:00 AM', media: { icon: 'calendar', hue: 'surface' },
        facts: [{ icon: 'person', label: 'Presiding', value: 'H.E. Metropolitan Serapion' },
          { icon: 'person', label: 'Council Attendance', value: 12, data: true, action: { label: 'Attendance', icon: 'edit', name: 'Take council attendance', onClick: noop } },
          { icon: 'folder', label: 'Cases to assign', value: 10, data: true, action: { label: 'Add more', name: 'Add cases to assign', onClick: noop } },
          { icon: 'calendar', label: 'Scheduled for hearing', value: 10, data: true, action: { label: 'Add more', name: 'Add cases scheduled for hearing', onClick: noop } }],
        states: states }),
      h('h2', null, 'Header style 1, with the new title (the Title role: 20px bold)'),
      h(P.EntityHeader, { headingLevel: 2, title: 'Maya Chen', subtitle: 'Creative Director · Apex Co', media: { person: 'Maya Chen', color: 'blue' }, status: { tone: 'action-required', icon: 'alert', label: 'Reconnect due' },
        facts: [{ label: 'Last message', value: '10:24 AM', data: true }, { label: 'Owner', value: 'Sam Patel' }], next: { title: 'Send the revised quote', detail: 'Due tomorrow · Sam Patel' },
        actions: [{ icon: 'phone', label: 'Call' }, { icon: 'message', label: 'Message', primary: true }, { icon: 'share', label: 'Share' }] }));
  }
  window.ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
})();
</script>
</body>
</html>
