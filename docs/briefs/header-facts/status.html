<!doctype html>
<html lang="en" data-plx-theme="default" data-plx-mode="light" data-plx-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header status box</title>
<link rel="stylesheet" href="../../../platform/system/fonts.css">
<link rel="stylesheet" href="../../../platform/platform.css">
<style>
/* A study page (not Platform code): each count box has its label on top (with its icon), the number at the start of the
   row below, and "Add more" at the end of that row. Plenix tokens and Buttons only. */
body{background:var(--plx-sys-surface-canvas);color:var(--plx-sys-content-default);font-family:var(--plx-sys-text-body-font-family);margin:0;padding:var(--plx-sys-space-layout-md);}
h1{font-size:var(--plx-sys-text-heading-font-size);margin:0 0 var(--plx-sys-space-stack-lg);}
.v{margin-block-end:var(--plx-sys-space-layout-md);}
.v h2{font-size:var(--plx-sys-text-label-font-size);font-weight:var(--plx-sys-text-label-font-weight);margin:0 0 var(--plx-sys-space-stack-xs);}
.v p.note{color:var(--plx-sys-content-subtle);font-size:var(--plx-sys-text-caption-font-size);margin:var(--plx-sys-space-stack-xs) 0 0;}
.hdr{background:var(--plx-sys-surface-default);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-card-6px);display:grid;gap:var(--plx-sys-space-layout-sm);grid-template-columns:minmax(0,1fr);max-inline-size:none;padding:var(--plx-sys-space-inset-lg);}
.main{display:flex;flex-direction:column;gap:var(--plx-sys-space-stack-sm);}
.head{align-items:center;display:flex;gap:var(--plx-sys-space-inline-md);}
.tile{align-items:center;background:var(--plx-sys-surface-canvas);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-surface-6px);color:var(--plx-sys-action-primary-background);display:flex;block-size:var(--plx-ref-size-44px);inline-size:var(--plx-ref-size-44px);justify-content:center;}
.tile .plx-icon{--plx-comp-icon-size:var(--plx-ref-size-24px);}
.title{font-family:var(--plx-sys-text-title-font-family);font-size:var(--plx-sys-text-title-font-size);font-weight:var(--plx-sys-text-title-font-weight);letter-spacing:var(--plx-sys-text-title-letter-spacing);line-height:var(--plx-sys-text-title-line-height);}
.sub{color:var(--plx-sys-content-muted);}
.rule{background:var(--plx-sys-action-primary-background);block-size:var(--plx-sys-border-width-thick);}
.aside{align-items:flex-end;border-inline-start:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-divider);display:flex;flex-direction:column;justify-content:space-between;padding-inline-start:var(--plx-sys-space-inset-lg);}
.seg{border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-default);border-radius:var(--plx-sys-radius-control-4px);display:inline-flex;font-size:var(--plx-sys-text-caption-font-size);overflow:hidden;}
.seg span{padding:var(--plx-sys-space-inset-xs) var(--plx-sys-space-inset-sm);white-space:nowrap;}
.seg span+span{border-inline-start:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-default);}
.seg .on{background:var(--plx-sys-data-color-blue-soft);color:var(--plx-sys-data-color-blue-on-soft);}
.mono{font-family:var(--plx-sys-text-mono-font-family);word-spacing:var(--plx-sys-text-mono-word-spacing);}
.lbl{align-items:center;color:var(--plx-sys-content-muted);display:flex;font-size:var(--plx-sys-text-caption-font-size);gap:var(--plx-sys-space-inline-xs);white-space:nowrap;}
.lbl .plx-icon{--plx-comp-icon-size:var(--plx-ref-size-16px);color:var(--plx-sys-data-color-blue-on-soft);}
.val{font-size:var(--plx-ref-font-size-15);font-weight:var(--plx-sys-font-weight-semibold);white-space:nowrap;}
.big{font-size:var(--plx-ref-font-size-24);font-weight:var(--plx-sys-font-weight-semibold);line-height:var(--plx-ref-line-height-tight);}
.row{align-items:stretch;display:flex;gap:var(--plx-sys-space-inline-sm);}
.f{background:var(--plx-sys-surface-canvas);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-surface-6px);padding:var(--plx-sys-space-inset-sm);}
/* Presiding, as you showed it */
.p{align-items:center;display:flex;gap:var(--plx-sys-space-inline-sm);}
.ib{align-items:center;background:var(--plx-sys-surface-default);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-detail-4px);color:var(--plx-sys-content-muted);display:flex;flex-shrink:0;block-size:var(--plx-ref-size-40px);inline-size:var(--plx-ref-size-40px);justify-content:center;}
.ib .plx-icon{--plx-comp-icon-size:var(--plx-ref-size-20px);}
/* a count: the label on top; the number at the start and Add more at the end of the row below */
.c{display:flex;flex-direction:column;gap:var(--plx-sys-space-stack-xs);}
.c .line{align-items:center;display:flex;gap:var(--plx-sys-space-inline-sm);}
.c .line .lbl{margin-inline-end:var(--plx-sys-space-inline-sm);}
/* the status box: a fact box with the label on top and the three states; each state's icon in its color, the current state filled */
.st{background:var(--plx-sys-surface-canvas);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-subtle);border-radius:var(--plx-sys-radius-surface-6px);display:flex;flex-direction:column;gap:var(--plx-sys-space-stack-xs);padding:var(--plx-sys-space-inset-sm);}
.opts{display:flex;gap:var(--plx-sys-space-inline-xs);}
.o{align-items:center;background:var(--plx-sys-surface-default);border:var(--plx-sys-border-width-thin) solid var(--plx-sys-border-default);border-radius:var(--plx-sys-radius-control-4px);color:var(--plx-sys-content-default);display:inline-flex;font-size:var(--plx-sys-text-caption-font-size);gap:var(--plx-sys-space-inline-xs);padding:var(--plx-sys-space-inset-xs) var(--plx-sys-space-inset-sm);white-space:nowrap;}
.o .plx-icon{--plx-comp-icon-size:var(--plx-ref-size-16px);}
.o.draft .plx-icon{color:var(--plx-ref-color-yellow-500);}
.o.prog .plx-icon{color:var(--plx-sys-feedback-success-solid);}
.o.adj .plx-icon{color:var(--plx-sys-feedback-danger-solid);}
.o.on{font-weight:var(--plx-sys-font-weight-semibold);}
.o.on .plx-icon{color:inherit;}
.o.draft.on{background:var(--plx-ref-color-yellow-300);border-color:var(--plx-ref-color-yellow-500);color:var(--plx-ref-color-gray-950);}
.o.prog.on{background:var(--plx-sys-feedback-success-solid);border-color:var(--plx-sys-feedback-success-solid-border);color:var(--plx-sys-feedback-success-on-solid);}
.o.adj.on{background:var(--plx-sys-feedback-danger-solid);border-color:var(--plx-sys-feedback-danger-solid-border);color:var(--plx-sys-feedback-danger-on-solid);}
</style>
</head>
<body>
<h1>Session header: Council Attendance joins the facts (the number present and its action)</h1>
<div id="out"></div>
<script>
var I = function (n) { return '<span class="plx-icon plx-icon--' + n + '" aria-hidden="true"></span>'; };
var btn = function (kind, name) { return '<button type="button" class="plx-button plx-button--' + kind + ' plx-button--size-xs" aria-label="' + name + '"><span class="plx-button__icon">' + I('add') + '</span><span class="plx-button__label">Add more</span></button>'; };
var presiding = '<div class="f p"><span class="ib">' + I('person') + '</span><div><div class="lbl">Presiding</div><div class="val">H.E. Metropolitan Serapion</div></div></div>';
var attendance = function () { return '<div class="f c"><div class="lbl">' + I('person') + 'Council Attendance</div><div class="line"><span class="big mono">12</span><button type="button" class="plx-button plx-button--secondary plx-button--size-xs" aria-label="Take council attendance"><span class="plx-button__icon">' + I('edit') + '</span><span class="plx-button__label">Attendance</span></button></div></div>'; };
var count = function (kind, icon, label, n, name) { return '<div class="f c"><div class="lbl">' + I(icon) + label + '</div><div class="line"><span class="big mono">' + n + '</span>' + btn(kind, name) + '</div></div>'; };
var statusBox = function (on) { var o = function (k, icon, t) { return '<span class="o ' + k + (on === k ? ' on' : '') + '" role="radio" aria-checked="' + (on === k) + '">' + I(icon) + t + '</span>'; }; return '<div class="st" role="radiogroup" aria-label="Status"><div class="lbl">Status</div><div class="opts">' + o('draft', 'pencil', 'Draft') + o('prog', 'clock', 'In progress') + o('adj', 'do-not-disturb', 'Adjourned') + '</div></div>'; };
var V = [
  ['secondary', 'In progress (green)', 'prog'],
  ['secondary', 'Draft (yellow)', 'draft'],
  ['secondary', 'Adjourned (red)', 'adj']
];
var out = document.getElementById('out');
V.forEach(function (v) {
  var s = document.createElement('section'); s.className = 'v';
  s.innerHTML = '<h2>' + v[1] + '</h2><div class="hdr"><div class="main">'
    + '<div class="head"><span class="tile">' + I('calendar') + '</span><div><div class="title">Council Session 2026-10-22</div><div class="sub">Thursday, October 22, 2026 at 10:00 AM</div></div></div>'
    + '<div class="rule"></div><div class="row">' + presiding + attendance()
    + count(v[0], 'folder', 'Cases to assign', 10, 'Add cases to assign')
    + count(v[0], 'calendar', 'Scheduled for hearing', 10, 'Add cases scheduled for hearing') + statusBox(v[2]) + '</div></div>'
    + '</div></div>'
    
  out.appendChild(s);
});
</script>
</body>
</html>
