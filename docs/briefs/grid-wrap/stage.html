<!doctype html>
<html lang="en" data-plx-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrap stage · Plenix review</title>
<!-- The stage for the wrap pictures: a DataGrid with a long Notes column and a static Table, drawn with the Platform.
     ?wrap=1 starts the Notes column wrapped (as the column menu's Wrap text does). -->
<link rel="stylesheet" href="../../../platform/system/fonts.css">
<link rel="stylesheet" href="../../../platform/platform.css">
<link rel="stylesheet" href="../review.css">
<script src="../../../platform/vendor/react-loader.js"></script>
<script src="../../../platform/dist/platform.js"></script>
</head>
<body class="rv-page">
<div id="root" class="rv-doc"></div>
<script>
(function () {
  const h = React.createElement, P = window.Plenix, q = new URLSearchParams(location.search), wrap = q.get('wrap') === '1', mock = q.get('mock');
  const notes = ['Waiting on the signed copy from the client before we can send the final invoice and close the project; the client asked for one more change to the delivery dates and a second review of the payment terms by their legal team.',
    'Short note', 'The proposal covers three phases; the second needs a site visit and a revised budget before approval.',
    'Approved on Monday', 'Draft started; the legal team asked for a review of the payment terms and the delivery dates.'];
  const rows = notes.map((n, i) => ({ id: i + 1, name: ['Northwind report', 'Contoso proposal', 'Fabrikam invoice', 'Apex brief', 'Litware contract'][i], owner: ['Maya Chen', 'Jeff Torres', 'Luis Herrera', 'Sarah Morgan', 'Ana Ruiz'][i], note: n }));
  const columns = [{ title: 'Name', field: 'name', kind: 'name', rowLabel: true, frozen: true }, { title: 'Owner', field: 'owner' },
    { title: 'Notes', field: 'note', width: '--plx-ref-size-320px', wrap,
    render: mock ? (r) => h('span', { className: 'rv-cut' }, h('span', { className: 'rv-cut__text' }, r.note), r.note.length > 40 ? (mock === 'b' && r.id === 1
      ? h(P.Popover, { defaultOpen: true, label: 'Notes', title: r.name, size: 'sm', placement: 'bottom-end', trigger: h(P.Button, { variant: 'ghost', size: 'xs', iconOnly: true, icon: 'expand', label: 'Show the full note' }) }, h('div', { className: 'rv-pop' }, r.note))
      : h(P.Button, { variant: 'ghost', size: 'xs', iconOnly: true, icon: 'expand', label: 'Show the full note' })) : null) : undefined }];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { id: 'stage' },
    h(P.DataGrid, { label: 'Documents', data: rows, columns, height: '--plx-ref-size-320px', rowHeight: wrap ? 'medium' : undefined })));
})();
</script>
</body>
</html>
