<!doctype html>
<html lang="en" data-plx-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line, Area, Bar and Pie on ECharts · live preview · Plenix review</title>
<!-- The live preview for the owner (#353, the first four charts): every variant of LineChart, AreaChart, BarChart and
     PieChart, today's (left, window.Plenix) next to the new Platform code drawing with ECharts (right, window.PlenixNext,
     bundled from platform/charts/ by build-preview.js; nothing else is built). Made-up St. John the Beloved data. -->
<link rel="stylesheet" href="../../../platform/system/fonts.css">
<link rel="stylesheet" href="../../../platform/platform.css">
<link rel="stylesheet" href="../review.css">
<link rel="stylesheet" href="../charts-echarts/preview.css">
<script src="../../../platform/vendor/react-loader.js"></script>
<script src="../../../platform/dist/platform.js"></script>
<!-- the preview bundle sits in this folder, so it is told where the Platform's vendor folder is -->
<script>window.PlenixVendorBase = new URL('../../../platform/vendor/', location.href).href;</script>
<script src="next.js"></script>
</head>
<body class="rv-page">
<main class="rv-doc" id="root"></main>
<script>
(function () {
  var h = React.createElement, P = window.Plenix, N = window.PlenixNext;
  var usd = function (v) { return P.formatCurrency(v, 'USD', { decimals: 0 }); };
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
  var row = function (keys, cols) { return months.map(function (m, i) { var o = { month: m }; keys.forEach(function (k, j) { o[k] = cols[j][i]; }); return o; }); };
  var funds = [{ id: 'offertory', label: 'Offertory' }, { id: 'building', label: 'Building fund' }, { id: 'pantry', label: 'Food pantry' }];
  var giving = row(['offertory', 'building', 'pantry'], [[18400, 17900, 19600, 24800, 21300, 20100, 18800, 19200, 21700, 22900], [6200, 5800, 6900, 8400, 7100, 6600, 5900, 6100, 7800, 8300], [2100, 1900, 2300, 2800, 2400, 2600, 2900, 3400, 4700, 5600]]);
  // Sunday Mass attendance, every Sunday from May to October 2026 (made up); the parish picnic Sunday was not counted
  var sundays = [], d = new Date(2026, 4, 3);
  for (var i = 0; i < 26; i++) { sundays.push({ day: new Date(d), people: i === 9 ? null : Math.round(612 + 60 * Math.sin(i / 3) + (i % 4) * 9 - (i > 12 && i < 18 ? 70 : 0)) }); d.setDate(d.getDate() + 7); }
  var rota = [{ week: 'Week 1', n: 18 }, { week: 'Week 2', n: 18 }, { week: 'Week 3', n: 21 }, { week: 'Week 4', n: 21 }, { week: 'Week 5', n: 21 }, { week: 'Week 6', n: 24 }, { week: 'Week 7', n: 24 }, { week: 'Week 8', n: 22 }];
  var pantry = row(['families', 'newHomes'], [[64, 61, 70, 74, 69, 72, 80, 88, 104, 118], [8, 6, 11, 9, 7, 10, 14, 17, 22, 26]]);
  var ages = [17, 19, 22, 24, 25, 28, 29, 31, 33, 34, 35, 36, 38, 39, 41, 42, 42, 44, 45, 46, 47, 48, 49, 51, 52, 53, 54, 55, 56, 57, 58, 58, 59, 61, 62, 63, 64, 65, 66, 67, 68, 69, 71, 72, 74, 76, 78, 81];

  var CHARTS = [
    { id: 'line', name: 'LineChart', items: [
      { id: 'line-giving', label: 'Three series, currency, points', kind: 'LineChart', props: { title: 'Giving by month, 2026', description: 'The offertory peaked at Easter in April; the food pantry fund more than doubled during the fall drive.', data: giving, x: 'month', series: funds, yLabel: 'Giving (USD)', format: usd, points: true } },
      { id: 'line-step', label: 'Step curve', kind: 'LineChart', props: { title: 'Servants on the Sunday rota', description: 'The rota grew in steps as new servants finished their training.', data: rota, x: 'week', series: [{ id: 'n', label: 'Servants' }], curve: 'step', points: true, yLabel: 'Servants' } },
      { id: 'line-time', label: 'Dates, a missing Sunday, zoom', kind: 'LineChart', props: { title: 'Sunday Mass attendance', description: 'Attendance dipped over the summer and came back in September; the picnic Sunday was not counted.', data: sundays, x: 'day', series: [{ id: 'people', label: 'People' }], yLabel: 'People', zero: false, zoom: true } },
    ] },
    { id: 'area', name: 'AreaChart', items: [
      { id: 'area-none', label: 'Overlapping (stack "none")', kind: 'AreaChart', props: { title: 'Food pantry, families served', description: 'More families came every month of the fall drive, many of them for the first time.', data: pantry, x: 'month', series: [{ id: 'families', label: 'Families served' }, { id: 'newHomes', label: 'New families' }], yLabel: 'Families' } },
      { id: 'area-stacked', label: 'Stacked', kind: 'AreaChart', props: { title: 'Giving by fund', description: 'Total giving peaked at Easter; the food pantry fund grew the most in the fall.', data: giving, x: 'month', series: funds, stack: 'stacked', format: usd, yLabel: 'Giving (USD)' } },
      { id: 'area-percent', label: 'Percent', kind: 'AreaChart', props: { title: 'Share of giving by fund', description: 'The food pantry’s share of giving doubled from January to October.', data: giving, x: 'month', series: funds, stack: 'percent', format: usd } },
    ] },
    { id: 'bar', name: 'BarChart', items: [
      { id: 'bar-grouped', label: 'Bars across, grouped', kind: 'BarChart', props: { title: 'Servants by ministry', description: 'Every ministry has more servants than last year; the food pantry grew the most.', categories: ['Altar servers', 'Choir', 'Readers', 'Sunday school', 'Food pantry', 'Hospitality', 'Ushers'], series: [{ id: 'y2025', label: '2025', values: [14, 22, 11, 9, 12, 8, 10] }, { id: 'y2026', label: '2026', values: [17, 24, 13, 12, 21, 10, 11] }], valueLabel: 'Servants' } },
      { id: 'bar-stacked', label: 'Columns, stacked, with values', kind: 'BarChart', props: { title: 'Mass attendance by Mass', description: 'The 10:00 Mass is always the fullest; Christmas and Easter months are the busiest.', orientation: 'vertical', layout: 'stacked', showValues: true, categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'], series: [{ id: 'm8', label: '8:00', values: [610, 580, 640, 820, 600, 560] }, { id: 'm10', label: '10:00', values: [1240, 1190, 1310, 1720, 1250, 1130] }, { id: 'm12', label: '12:00', values: [720, 690, 750, 980, 700, 650] }], valueLabel: 'People', categoryLabel: 'Month' } },
      { id: 'bar-percent', label: 'Bars across, percent', kind: 'BarChart', props: { title: 'How people give', description: 'Online giving passed envelopes in the summer.', layout: 'percent', showValues: true, categories: ['Jan', 'Mar', 'May', 'Jul', 'Sep'], series: [{ id: 'env', label: 'Envelope', values: [520, 480, 430, 380, 360] }, { id: 'web', label: 'Online', values: [310, 350, 420, 470, 510] }, { id: 'txt', label: 'Text to give', values: [60, 70, 90, 110, 130] }] } },
      { id: 'bar-histogram', label: 'Histogram', kind: 'BarChart', props: { title: 'Ages of our servants', description: 'Servants of every age: most are between 40 and 70.', orientation: 'vertical', histogram: { values: ages, bins: 7 }, categoryLabel: 'Age', valueLabel: 'Servants', showValues: true } },
    ] },
    { id: 'pie', name: 'PieChart', items: [
      { id: 'pie-pie', label: 'Pie, with an Other slice and shares', kind: 'PieChart', props: { title: 'Gifts by fund, October', description: 'The offertory is more than half of all gifts; six small funds are grouped as Other.', showValues: true, format: usd, data: [{ id: 'off', label: 'Offertory', value: 22900 }, { id: 'bld', label: 'Building fund', value: 8300 }, { id: 'pan', label: 'Food pantry', value: 5600 }, { id: 'mis', label: 'Missions', value: 2100 }, { id: 'flo', label: 'Flowers', value: 900 }, { id: 'can', label: 'Candles', value: 700 }, { id: 'pal', label: 'Palms', value: 400 }, { id: 'boo', label: 'Books', value: 300 }] } },
      { id: 'pie-donut', label: 'Donut', kind: 'PieChart', props: { title: 'Servants by ministry', description: 'The choir and the food pantry have the most servants.', variant: 'donut', centerLabel: 'servants', data: [{ id: 'ch', label: 'Choir', value: 24 }, { id: 'fp', label: 'Food pantry', value: 21 }, { id: 'al', label: 'Altar servers', value: 17 }, { id: 'rd', label: 'Readers', value: 13 }, { id: 'ss', label: 'Sunday school', value: 12 }] } },
      { id: 'pie-half', label: 'Half ring', kind: 'PieChart', props: { title: 'Building fund goal', description: 'Two thirds of the new roof is paid for.', variant: 'half', centerValue: '68%', centerLabel: 'of $250,000', format: usd, data: [{ id: 'given', label: 'Given', value: 170000 }, { id: 'left', label: 'Still to give', value: 80000 }] } },
    ] },
  ];

  var stage = function (id, label, node) { return h('div', { className: 'rv-stage rv-ec-cell', id: id }, h('p', { className: 'rv-ec-label' }, label), node); };
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('h1', { className: 'rv-h1' }, 'Line, Area, Bar and Pie on ECharts: live preview'),
    h('p', { className: 'rv-lead' }, 'Left: today’s chart. Right: the new Platform code, drawn by ECharts. Try every chart on the right with Tab and the arrow keys, the pointer, the legend and “Show the data”. Every number is made up.'),
    CHARTS.map(function (c) {
      return h('section', { key: c.id, className: 'rv-section', id: c.id }, h('h2', { className: 'rv-h2' }, c.name),
        c.items.map(function (it) {
          return h('div', { key: it.id, className: 'rv-section', id: it.id }, h('p', { className: 'rv-ec-label' }, it.label),
            h('div', { className: 'rv-pair' }, stage(it.id + '-today', 'Today', h(P[it.kind], it.props)), stage(it.id + '-new', 'New (ECharts)', h(N[it.kind], it.props))));
        }));
    })));
})();
</script>
</body>
</html>
