<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataGrid row hover study</title>
<link rel="stylesheet" href="../../platform/platform.css">
<script src="../../platform/providers/theme-boot.js"></script>
<script src="../../platform/vendor/react-loader.js"></script>
<script src="../../platform/dist/platform.js"></script>
<script src="../../platform/engines/plenix-engines.js"></script>
<style>
/* The owner's row hover study (2026-10-23): the real grid, silver header; each hover keeps the grid lines visible. Palette colors only. */
body{background:var(--plx-sys-color-surface-page,var(--plx-ref-color-gray-75));margin:0;}
.study{display:grid;gap:var(--plx-ref-space-32px);margin-inline:auto;max-inline-size:var(--plx-ref-size-900px);padding:var(--plx-ref-space-32px) var(--plx-ref-space-16px);}
.study__intro h1{font-size:var(--plx-sys-font-size-heading-lg,1.5rem);margin:0 0 var(--plx-ref-space-8px);}
.study__intro p{color:var(--plx-ref-color-gray-700);margin:0;}
.study__option h2{font-size:var(--plx-sys-font-size-heading-sm,1rem);margin:0 0 var(--plx-ref-space-4px);}
.study__option p{color:var(--plx-ref-color-gray-700);margin:0 0 var(--plx-ref-space-12px);}
/* every option: the header band carries the gradient; its cells are clear so the band shows through */
.study__option .plx-data-grid__grid-header{background-color:transparent;}
.study__option .plx-data-grid__grid-col,.study__option .plx-data-grid__grid-headers{background-color:transparent;}
.study__option .plx-data-grid__grid-col-title{color:var(--plx-comp-data-grid-header-text);}
.study__option .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-gray-900);}
.study__option .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-50),var(--plx-ref-color-gray-200));border-block-end-color:var(--plx-ref-color-gray-400);}
.study__option .plx-data-grid[data-plx-density="compact"] .plx-data-grid__grid-header{--plx-comp-data-grid-height:var(--plx-ref-size-28px);}
.study__option .plx-data-grid[data-plx-density="standard"] .plx-data-grid__grid-header{--plx-comp-data-grid-height:var(--plx-ref-size-32px);}
.study__option .plx-data-grid[data-plx-density="comfortable"] .plx-data-grid__grid-header{--plx-comp-data-grid-height:var(--plx-ref-size-40px);}
/* clicking the title sorts; on hover the options button shows at the right edge, full height, a 1px line on its left */
.study__option .plx-data-grid__grid-header-popup-button--menu{background-color:transparent;block-size:100%;border-inline-start-color:var(--plx-ref-color-gray-400);border-inline-start-style:solid;border-inline-start-width:var(--plx-sys-border-width-thin);border-radius:0;inset-block-start:0;inset-inline-end:0;padding-inline-end:var(--plx-ref-space-4px);padding-inline-start:var(--plx-ref-space-4px);transform:none;}
.study__option .plx-data-grid__grid-header-popup-button--menu:hover{background-color:var(--plx-ref-color-gray-200);}
/* the resize handle draws no blue mark on hover: the resize cursor is the cue, as in Explorer */
.study__option .plx-data-grid__grid-col-resize-handle:hover{background-image:none;}

/* R1 soft tint */
.r1 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){--plx-comp-data-grid-context-row-fill:var(--plx-ref-color-gray-75);}
/* R2 tint with defined lines */
.r2 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){--plx-comp-data-grid-context-row-fill:var(--plx-ref-color-gray-100);}
.r2 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){border-block-end-color:var(--plx-ref-color-gray-300);}
.r2 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) .plx-data-grid__grid-cell::before,.r2 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) .plx-data-grid__grid-cell::after{background-color:var(--plx-ref-color-gray-300);}
.r2 .plx-data-grid__grid-row:has(+ .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected)){border-block-end-color:var(--plx-ref-color-gray-300);}
/* R3 blue tint (Explorer) */
.r3 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){--plx-comp-data-grid-context-row-fill:var(--plx-ref-color-blue-50);}
.r3 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){border-block-end-color:var(--plx-ref-color-blue-200);}
.r3 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) .plx-data-grid__grid-cell::before,.r3 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) .plx-data-grid__grid-cell::after{background-color:var(--plx-ref-color-blue-200);}
.r3 .plx-data-grid__grid-row:has(+ .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected)){border-block-end-color:var(--plx-ref-color-blue-200);}
/* R4 soft tint with an accent bar at the start */
.r4 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){--plx-comp-data-grid-context-row-fill:var(--plx-ref-color-gray-75);}
.r4 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell:first-child{box-shadow:inset var(--plx-sys-border-width-thick) 0 0 var(--plx-ref-color-blue-600);}
/* R5 framed row: no fill, the row outlined */
.r5 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){--plx-comp-data-grid-context-row-fill:var(--plx-comp-data-grid-background);}
.r5 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell{box-shadow:inset 0 var(--plx-sys-border-width-thin) 0 var(--plx-ref-color-gray-400),inset 0 calc(var(--plx-sys-border-width-thin) * -1) 0 var(--plx-ref-color-gray-400);}
.r5 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell:first-child{box-shadow:inset var(--plx-sys-border-width-thin) 0 0 var(--plx-ref-color-gray-400),inset 0 var(--plx-sys-border-width-thin) 0 var(--plx-ref-color-gray-400),inset 0 calc(var(--plx-sys-border-width-thin) * -1) 0 var(--plx-ref-color-gray-400);}
.r5 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell:last-child{box-shadow:inset calc(var(--plx-sys-border-width-thin) * -1) 0 0 var(--plx-ref-color-gray-400),inset 0 var(--plx-sys-border-width-thin) 0 var(--plx-ref-color-gray-400),inset 0 calc(var(--plx-sys-border-width-thin) * -1) 0 var(--plx-ref-color-gray-400);}
/* R6 blue tint, framed */
.r6 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected){--plx-comp-data-grid-context-row-fill:var(--plx-ref-color-blue-50);}
.r6 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell{box-shadow:inset 0 var(--plx-sys-border-width-thin) 0 var(--plx-ref-color-blue-300),inset 0 calc(var(--plx-sys-border-width-thin) * -1) 0 var(--plx-ref-color-blue-300);}
.r6 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell:first-child{box-shadow:inset var(--plx-sys-border-width-thin) 0 0 var(--plx-ref-color-blue-300),inset 0 var(--plx-sys-border-width-thin) 0 var(--plx-ref-color-blue-300),inset 0 calc(var(--plx-sys-border-width-thin) * -1) 0 var(--plx-ref-color-blue-300);}
.r6 .plx-data-grid__grid-row.plx-data-grid__grid-selectable:hover:not(.plx-data-grid__grid-selected) > .plx-data-grid__grid-cell:last-child{box-shadow:inset calc(var(--plx-sys-border-width-thin) * -1) 0 0 var(--plx-ref-color-blue-300),inset 0 var(--plx-sys-border-width-thin) 0 var(--plx-ref-color-blue-300),inset 0 calc(var(--plx-sys-border-width-thin) * -1) 0 var(--plx-ref-color-blue-300);}
</style>
</head><body><div class="study" id="root"></div>
<script>
const h = React.createElement, P = window.Plenix;
const first = ['Michael', 'Marina', 'Peter', 'Irene', 'Samuel', 'Martha'], last = ['Hanna', 'Abdel-Malik', 'Tawfik', 'Girgis', 'Boulos', 'Saad'];
const status = ['Open', 'Closed', 'Adjourned', 'In session', 'Draft'];
const rows = Array.from({ length: 5 }, (_, i) => ({ id: i + 1, n: '2026' + String(100000 + i), who: { name: first[i] + ' ' + last[(i * 7) % 6], gender: i % 2 ? 'female' : 'male' },
  date: '2026-' + String(1 + i).padStart(2, '0') + '-' + String(3 + i * 4).padStart(2, '0'), amount: (i * 1237) % 5000, status: status[i], note: 'Note ' + ((i * 13) % 97) }));
const cols = [{ title: 'Case number', field: 'n', kind: 'data' }, { title: 'Person', field: 'who', type: 'person' }, { title: 'Date', field: 'date', type: 'date' },
  { title: 'Amount', field: 'amount', type: 'number' }, { title: 'Status', field: 'status' }, { title: 'Note', field: 'note' }];
const options = [
 [
  "r0",
  "Today",
  "Gray 200 fill: the same gray as the grid lines, so the lines vanish on the hovered row."
 ],
 [
  "r1",
  "R1 · Soft tint",
  "Gray 75 fill, lighter than the lines: every grid line stays in place. The quietest."
 ],
 [
  "r2",
  "R2 · Tint with defined lines",
  "Gray 100 fill, and the hovered row’s own lines (top, bottom, between cells) step to gray 300: the row reads as a band of cells."
 ],
 [
  "r3",
  "R3 · Blue tint (Explorer)",
  "Blue 50 fill with its lines in blue 200: the Windows Explorer hover, the cells still separated."
 ],
 [
  "r4",
  "R4 · Tint with an accent bar",
  "Gray 75 fill and a 3px blue 600 bar at the row’s start (the accent bar width the UI already uses)."
 ],
 [
  "r5",
  "R5 · Framed row",
  "No fill: a gray 400 frame around the row, over the lines; the column lines inside stay as they are. Modern and crisp."
 ],
 [
  "r6",
  "R6 · Blue tint, framed",
  "Blue 50 fill inside a blue 300 frame: the clearest “you are here”, lines kept."
 ]
];
function Grid({ title }) { const [sel, setSel] = React.useState([4]); return h(P.DataGrid, { label: title, data: rows, columns: cols, cells: 'pill', selectable: true, selected: sel, onSelectionChange: setSel }); }
function App() {
  return h(React.Fragment, null,
    h('div', { className: 'study__intro' }, h('h1', null, 'DataGrid row hover'), h('p', null, 'The real grid with the silver header. Hover a row in each grid; row 4 is selected in every grid, to compare the two states. Each hover keeps the grid lines visible, from the existing palette.')),
    options.map(([cls, title, text]) => h('section', { key: cls, className: 'study__option ' + cls }, h('h2', null, title), h('p', null, text), h(Grid, { title }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
