<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataGrid header study</title>
<link rel="stylesheet" href="../../platform/platform.css">
<script src="../../platform/providers/theme-boot.js"></script>
<script src="../../platform/vendor/react-loader.js"></script>
<script src="../../platform/dist/platform.js"></script>
<style>
/* The owner's header study (2026-10-23): the real DataGrid, six header treatments. Palette colors only (no new colors);
   each option is a soft top-to-bottom gradient with its own hue, a line under it and a title color from the same family. */
body{background:var(--plx-sys-color-surface-page,var(--plx-ref-color-gray-75));margin:0;}
.study{display:grid;gap:var(--plx-ref-space-32px);margin-inline:auto;max-inline-size:var(--plx-ref-size-900px);padding:var(--plx-ref-space-32px) var(--plx-ref-space-16px);}
.study__intro h1{font-size:var(--plx-sys-font-size-heading-lg,1.5rem);margin:0 0 var(--plx-ref-space-8px);}
.study__intro p{color:var(--plx-ref-color-gray-700);margin:0;}
.study__option h2{font-size:var(--plx-sys-font-size-heading-sm,1rem);margin:0 0 var(--plx-ref-space-4px);}
.study__option p{color:var(--plx-ref-color-gray-700);margin:0 0 var(--plx-ref-space-12px);}
/* every option: the header band carries the gradient; its cells are clear so the band shows through */
.study__option .plx-data-grid__grid-header{background-color:transparent;}
.study__option .plx-data-grid__grid-col,.study__option .plx-data-grid__grid-headers{background-color:transparent;}
.study__option .plx-data-grid__grid-col-title{color:var(--plx-comp-data-grid-header-text);}
.opt-a .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-blue-900);}
.opt-a .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-blue-50),var(--plx-ref-color-blue-100));border-block-end-color:var(--plx-ref-color-blue-250);}
.opt-c .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-gray-900);}
.opt-c .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-50),var(--plx-ref-color-gray-200));border-block-end-color:var(--plx-ref-color-gray-400);}
.opt-s .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-gray-900);}
.opt-s .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-200) 0%,var(--plx-ref-color-gray-100) 22%,var(--plx-ref-color-gray-75) 38%,var(--plx-ref-color-gray-50) 50%,var(--plx-ref-color-gray-75) 62%,var(--plx-ref-color-gray-100) 78%,var(--plx-ref-color-gray-200) 100%);border-block-end-color:var(--plx-ref-color-gray-400);}
.opt-s2 .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-gray-900);}
.opt-s2 .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-200) 0%,var(--plx-ref-color-gray-100) 18%,var(--plx-ref-color-gray-75) 32%,var(--plx-ref-color-gray-50) 44%,var(--plx-ref-color-gray-50) 56%,var(--plx-ref-color-gray-75) 68%,var(--plx-ref-color-gray-100) 82%,var(--plx-ref-color-gray-200) 100%);border-block-end-color:var(--plx-ref-color-gray-400);}
.opt-s3 .plx-data-grid,.opt-s4 .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-gray-900);}
.opt-s3 .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-200) 0%,var(--plx-ref-color-gray-100) 30%,var(--plx-ref-color-gray-75) 50%,var(--plx-ref-color-gray-100) 70%,var(--plx-ref-color-gray-200) 100%);border-block-end-color:var(--plx-ref-color-gray-400);}
.opt-s4 .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-200) 0%,var(--plx-ref-color-gray-75) 50%,var(--plx-ref-color-gray-200) 100%);border-block-end-color:var(--plx-ref-color-gray-400);}
.opt-d .plx-data-grid{--plx-comp-data-grid-header-text:var(--plx-ref-color-blue-900);}
.opt-d .plx-data-grid__grid-header{background-image:linear-gradient(to bottom,var(--plx-ref-color-blue-50),var(--plx-ref-color-blue-100));border-block-end-color:var(--plx-ref-color-blue-600);border-block-end-width:var(--plx-sys-border-width-thick);}
/* the Explorer header (owner, 2026-10-23): 28px in Compact, 32px in Standard, 40px in Comfortable; titles unchanged */
.study__option .plx-data-grid[data-plx-density="compact"] .plx-data-grid__grid-header{--plx-comp-data-grid-height:var(--plx-ref-size-28px);}
.study__option .plx-data-grid[data-plx-density="standard"] .plx-data-grid__grid-header{--plx-comp-data-grid-height:var(--plx-ref-size-32px);}
.study__option .plx-data-grid[data-plx-density="comfortable"] .plx-data-grid__grid-header{--plx-comp-data-grid-height:var(--plx-ref-size-40px);}
/* clicking the title sorts; on hover the options button shows at the right edge, full height, a 1px line on its left */
.study__option .plx-data-grid__grid-header-popup-button--menu{background-color:transparent;block-size:100%;border-inline-start-color:var(--plx-ref-color-gray-400);border-inline-start-style:solid;border-inline-start-width:var(--plx-sys-border-width-thin);border-radius:0;inset-block-start:0;inset-inline-end:0;padding-inline-end:var(--plx-ref-space-4px);padding-inline-start:var(--plx-ref-space-4px);transform:none;}
.study__option .plx-data-grid__grid-header-popup-button--menu:hover{background-color:var(--plx-ref-color-gray-200);}
/* the resize handle draws no blue mark on hover: the resize cursor is the cue, as in Explorer */
.study__option .plx-data-grid__grid-col-resize-handle:hover{background-image:none;}
.opt-a .plx-data-grid__grid-header-popup-button--menu,.opt-d .plx-data-grid__grid-header-popup-button--menu{border-inline-start-color:var(--plx-ref-color-blue-250);}
.opt-a .plx-data-grid__grid-header-popup-button--menu:hover,.opt-d .plx-data-grid__grid-header-popup-button--menu:hover{background-color:var(--plx-ref-color-blue-200);}
/* hover studies on silver C: the header's inner lines are each column's ::before (its start edge) */
.hv1 .plx-data-grid__grid-col::before{background-color:transparent;}
.hv1 .plx-data-grid__grid-header:hover .plx-data-grid__grid-col::before{background-color:var(--plx-ref-color-gray-400);}
.hv2 .plx-data-grid__grid-col:hover,.hv3 .plx-data-grid__grid-col:hover{background-image:linear-gradient(to bottom,var(--plx-ref-color-gray-100),var(--plx-ref-color-gray-300));}
.hv2 .plx-data-grid__grid-col:hover::before,.hv2 .plx-data-grid__grid-col:hover + .plx-data-grid__grid-col::before{background-color:var(--plx-ref-color-gray-400);}
.hv3 .plx-data-grid__grid-header:hover .plx-data-grid__grid-col::before{background-color:var(--plx-ref-color-gray-350);}
.hv3 .plx-data-grid__grid-header:hover .plx-data-grid__grid-col:hover::before,.hv3 .plx-data-grid__grid-header:hover .plx-data-grid__grid-col:hover + .plx-data-grid__grid-col::before{background-color:var(--plx-ref-color-gray-400);}
</style>
</head><body><div class="study" id="root"></div>
<script>
const h = React.createElement, P = window.Plenix;
const first = ['Michael', 'Marina', 'Peter', 'Irene', 'Samuel', 'Martha'], last = ['Hanna', 'Abdel-Malik', 'Tawfik', 'Girgis', 'Boulos', 'Saad'];
const status = ['Open', 'Closed', 'Adjourned', 'In session', 'Draft'];
const rows = Array.from({ length: 5 }, (_, i) => ({ id: i + 1, n: '2026' + String(100000 + i), who: { name: first[i] + ' ' + last[(i * 7) % 6], gender: i % 2 ? 'female' : 'male' },
  date: '2026-' + String(1 + i).padStart(2, '0') + '-' + String(3 + i * 4).padStart(2, '0'), amount: (i * 1237) % 5000, status: status[i], note: 'Note ' + ((i * 13) % 97) }));
const cols = [{ title: 'Case number', field: 'n', kind: 'data' }, { title: 'Person', field: 'who', type: 'person' }, { title: 'Date', field: 'date', type: 'date' },
  { title: 'Amount', field: 'amount', type: 'number' }, { title: 'Status', field: 'status' }, { title: 'Note', field: 'note' }];
const options = [
  ['opt-c', 'C · Silver (chosen)', 'Gray 50 to gray 200 with a gray 400 line. The hover as it is today: the column tints, the lines stay light.'],
  ['opt-c hv1', 'H1 · Lines on hover', 'At rest the header has no inner lines. Hovering the header draws every column line in gray 400, so the columns read as separate boxes while you work in the header.'],
  ['opt-c hv2', 'H2 · Column frame', 'The inner lines stay light at rest. The hovered column gets a gray 400 line on both sides and its band one shade deeper (gray 100 to gray 300), like a pressed key.'],
  ['opt-c hv3', 'H3 · Explorer', 'Hovering the header shows every column line in gray 350; the hovered column also deepens and its own two lines turn gray 400. The closest to Windows Explorer.'],
];
// the application's field actions in the column menu (the grid adds sort, filter and group after them)
const act = () => {};
const columnMenu = [{ label: 'Duplicate field', icon: 'ed-copy', onSelect: act }, { label: 'Insert left', icon: 'arrow-left', onSelect: act }, { label: 'Insert right', icon: 'forward', onSelect: act }, { separator: true },
  { label: 'Copy field URL', icon: 'link', onSelect: act }, { label: 'Edit field description', icon: 'circle-info', onSelect: act }, { label: 'Edit field permissions', icon: 'lock', onSelect: act }];
function App() {
  return h(React.Fragment, null,
    h('div', { className: 'study__intro' }, h('h1', null, 'DataGrid header'), h('p', null, 'The real grid with the Explorer header in silver C: 28px tall in Compact (32px Standard, 40px Comfortable). Click a title to sort; hover a column for its options button. Below: three hovers that show the inner column lines.')),
    options.map(([cls, title, text]) => h('section', { key: cls, className: 'study__option ' + cls },
      h('h2', null, title), h('p', null, text),
      h(P.DataGrid, { label: title, data: rows, columns: cols, cells: 'pill', selectable: true, columnMenu }))),
    [['standard', 'Standard: 32px header'], ['comfortable', 'Comfortable: 40px header']].map(([density, title]) => h('section', { key: density, className: 'study__option opt-c hv3' },
      h('h2', null, 'H3 · ' + title), h('p', null, 'The same header at the other densities: the rows grow with it.'),
      h(P.DataGrid, { label: title, data: rows, columns: cols, cells: 'pill', selectable: true, density }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
