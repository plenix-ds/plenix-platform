<style>

:root{

  --blue-bg:#1c2a45;--blue-fg:#a9c6fb;--blue-bd:#36507e;
  --green-bg:#17301f;--green-fg:#9fdcae;--green-bd:#2f5a3b;
  --amber-bg:#352711;--amber-fg:#f1cc7f;--amber-bd:#6a4c19;
  --red-bg:#3a1b1c;--red-fg:#f3aaaa;--red-bd:#6e3133;
  --violet-bg:#261f43;--violet-fg:#c8bdf6;--violet-bd:#4a3d7e;
  --teal-bg:#13302d;--teal-fg:#94d8cf;--teal-bd:#2a5a54;
  --orange-bg:#3a2214;--orange-fg:#f5bc94;--orange-bd:#6e3f22;
  --gray-bg:#262a31;--gray-fg:#c3c8d1;--gray-bd:#454b56;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
p,h1,h2,h3,h4{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1em;height:1em;fill:currentColor;flex:none;display:block}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top h1{font-size:22px;font-weight:500;text-wrap:balance}
.top p{color:var(--fg-2);margin-top:4px;max-width:70ch}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.step{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:500;display:flex;gap:8px;align-items:center}
.step b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:11px;letter-spacing:0}
/* capability rail */
.rail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);min-height:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;height:36px;background:var(--card);color:var(--fg-3)}
.search input{border:0;background:transparent;font:inherit;color:var(--fg);width:100%;outline:none}
.caps{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.cap{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:7px 8px;border-radius:8px;text-align:left;color:var(--fg-2);font-size:13px}
.cap .ic{font-size:18px;color:var(--fg-3)}
.cap:hover{background:var(--raise);color:var(--fg)}
.cap[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-fg);font-weight:500}
.cap[aria-pressed="true"] .ic{color:var(--accent-fg)}
.cap .n{margin-left:auto;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.rail-empty{color:var(--fg-3);font-size:13px;padding:8px}
/* style picker */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sty{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.sty:hover{border-color:var(--line-2)}
.sty[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sty .nm{font-size:13px;font-weight:500}
.sty .ds{font-size:12px;color:var(--fg-3)}
.wf{height:58px;border:1px solid var(--line);border-radius:6px;background:var(--raise);display:flex;padding:7px 8px;gap:8px;overflow:hidden}
.wf i{display:block;background:var(--line-2);border-radius:2px;flex:none}
.wf .wl{flex:1.7;display:flex;gap:6px;min-width:0}
.wf .wc{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.wf .wr{display:flex;gap:5px;align-items:center}
.wf .wt{display:flex;flex-direction:column;gap:3px}
.wf .wt i:first-child{width:46px;height:5px;background:var(--fg-3)}
.wf .wt i:last-child{width:34px;height:3px}
.wf .wb{height:3px;width:62%;background:var(--accent);border-radius:0}
.wf .wf2{display:flex;gap:5px}.wf .wf2 i{width:14px;height:6px}
.wf .wd{width:1px;background:var(--line-2);flex:none}
.wf .wrc{flex:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.wf .wrc .l1{width:36px;height:4px}.wf .wrc .bt{display:flex;gap:3px}.wf .wrc .bt i{width:7px;height:7px;background:transparent;border:1px solid var(--line-2)}
.wf .wi{background:var(--accent-bg);border:1px solid var(--blue-bd);border-radius:3px}
.wf-topS .wi{width:12px;height:12px}.wf-topL .wi{width:18px;height:18px}
.wf-colS .wi{width:12px;height:12px}.wf-colL .wi{width:32px;height:32px;align-self:center}
.wf-edge .wi{width:58px;height:58px;margin:-7px 0 -7px -8px;border-radius:5px 0 0 5px;border-width:0 1px 0 0;align-self:stretch}
/* preview */
.pv-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pv-h h2{font-size:15px;font-weight:500}
.pv-h p{font-size:12px;color:var(--fg-3)}
.stack{display:flex;flex-direction:column;gap:10px}
.cap-label{font-size:12px;color:var(--fg-3);display:flex;gap:6px;align-items:center;margin:6px 0 -4px}
.cap-label .ic{font-size:16px}
/* the header */
.hdr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;overflow:hidden}
.hdr.solo{grid-template-columns:minmax(0,1fr)}
.lc{min-width:0}
.split{display:flex;gap:16px;align-items:stretch}
.body{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hd{display:inline-flex;gap:12px;align-items:center;align-self:flex-start}
.tx{min-width:0}
.ttl{font-size:18px;font-weight:500;white-space:nowrap;line-height:1.3}
.sub{font-size:13px;color:var(--fg-2);white-space:nowrap}
.rule{height:6px;width:0;background:var(--accent);border-radius:0;margin:14px 0 12px}
.facts{display:inline-flex;flex-wrap:wrap;gap:12px;align-items:stretch;align-self:flex-start}
/* each fact is a tile sized to its content (same look as the Streamlined detail tiles) */
.facts>div{padding:4px 8px;border-radius:var(--plx-sys-shape-xs);background:var(--plx-sys-surface-canvas);border:1px solid var(--plx-sys-border-subtle)}
.facts .lbl{font-size:11px;color:var(--plx-sys-content-subtle)}
.facts .val{font-size:13px;font-weight:600;color:var(--plx-sys-content-default)}
/* inside a fact tile the status is colored text with its icon, not a pill */
.facts .val .pill{font-weight:500;font-size:13px;background:transparent;border:0;padding:0;border-radius:0;color:inherit}
/* the status tile itself takes the status color: tinted fill, matching border, colored label and value */
.facts>.st-tile .lbl{color:inherit}
.facts>.st-green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-fg)}
.facts>.st-blue{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-fg)}
.facts>.st-amber{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-fg)}
.facts>.st-red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-fg)}
.facts>.st-gray{background:var(--gray-bg);border-color:var(--gray-bd);color:var(--gray-fg)}
.facts>.st-violet{background:var(--violet-bg);border-color:var(--violet-bd);color:var(--violet-fg)}
.facts>.st-teal{background:var(--teal-bg);border-color:var(--teal-bd);color:var(--teal-fg)}
.facts>.st-orange{background:var(--orange-bg);border-color:var(--orange-bd);color:var(--orange-fg)}
.lbl{font-size:12px;color:var(--fg-3)}
.val{font-size:14px;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
.pill .ic{font-size:14px}
.rc{border-left:1px solid var(--line-2);padding-left:20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:right;min-width:0}
.nt{font-size:15px;margin-top:2px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ib{width:32px;height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--fg-2);padding:0}
.ib .ic{font-size:20px}
.ib:hover{background:var(--raise);color:var(--fg)}
.av{flex:none;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden;position:relative;font-weight:500}
.av.edge{margin:-16px 0 -16px -20px;border-radius:12px 0 0 12px}
.av .ini{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:4px}
.av .ini.b{border:2px solid var(--card)}
.blue{background:var(--blue-bg);color:var(--blue-fg);border-color:var(--blue-bd)}
.green{background:var(--green-bg);color:var(--green-fg);border-color:var(--green-bd)}
.amber{background:var(--amber-bg);color:var(--amber-fg);border-color:var(--amber-bd)}
.red{background:var(--red-bg);color:var(--red-fg);border-color:var(--red-bd)}
.violet{background:var(--violet-bg);color:var(--violet-fg);border-color:var(--violet-bd)}
.teal{background:var(--teal-bg);color:var(--teal-fg);border-color:var(--teal-bd)}
.orange{background:var(--orange-bg);color:var(--orange-fg);border-color:var(--orange-bd)}
.gray{background:var(--gray-bg);color:var(--gray-fg);border-color:var(--gray-bd)}
.neutral{background:var(--raise);color:var(--fg-3);border-color:var(--line)}
/* every avatar: 1px Plenix default border (gray-300 light, gray-700 dark); edge images keep only the inner side */
.hdr .av{border:1px solid var(--av-border)}
.hdr .av.edge{border-width:0 1px 0 0}
.hdr.stacked .av.edge{border-width:0 1px 1px 0}
/* section header: same anatomy, one step smaller */
.hdr.sec{padding:12px 16px;gap:16px;border-radius:10px}
.sec .av.edge{margin:-12px 0 -12px -16px;border-radius:10px 0 0 10px}
.sec .ttl{font-size:15px}
.sec .sub{font-size:12px}
.sec .rule{height:4px;margin:10px 0 6px}
.after{align-self:flex-start}
/* anatomy */
.anat-box summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;list-style-position:outside}
.anat-box summary h2{font-size:15px;font-weight:500;display:inline}
.anat-box summary span{font-size:12px;color:var(--fg-3)}
.fig{position:relative;padding:10px 0 4px}
.mk,.mk-l{width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--card);font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}
.mk{position:absolute;z-index:2;box-shadow:0 0 0 2px var(--page)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 20px}
.legend li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg-2)}
.legend b{color:var(--fg);font-weight:500;margin-right:2px}
.legend .reg{font-size:12px;color:var(--rg)}
.an-h{font-size:14px;font-weight:500;margin-top:8px}
.an-p{font-size:13px;color:var(--fg-2);margin-top:-4px}
.rg{position:absolute;z-index:1;border:1.5px dashed var(--rg);border-radius:4px;pointer-events:none}
.rg.in{border-style:dotted}
.rg-n,.rg-l{min-width:20px;height:18px;padding:0 5px;border-radius:4px;background:var(--rg);color:var(--card);font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.rg-n{position:absolute;z-index:2;box-shadow:0 0 0 2px var(--page)}
.rg-l{margin-right:8px}
.tbl-wrap{overflow-x:auto}
.rtbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.rtbl th,.rtbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.rtbl thead th{font-size:12px;color:var(--fg-3);font-weight:500;background:var(--raise)}
.rtbl tbody th{font-weight:500;white-space:nowrap;width:150px}
.rtbl td{color:var(--fg-2)}
.rtbl tr.in th{padding-left:26px;font-weight:400}
.rtbl tr.off th,.rtbl tr.off td{color:var(--fg-3)}
.rtbl tr.off .rg-l{opacity:.45}
.top{display:flex;flex-direction:column;gap:6px}
.top .show-tabs{align-self:flex-start;margin-top:8px}
.sec .rc{padding-left:16px;justify-content:center}
.sec .ib{width:28px;height:28px}.sec .ib .ic{font-size:18px}
.sec .split{gap:12px}
/* narrow: the right side moves under the left */
.hdr.stacked{grid-template-columns:minmax(0,1fr)}
.hdr.stacked .rc{border-left:0;border-top:1px solid var(--line-2);padding:12px 0 0;text-align:left}
.hdr.stacked .acts{justify-content:flex-start}
.hdr.stacked .av.edge{margin-bottom:0;border-radius:12px 0 0 0}
.hdr.stacked .ttl,.hdr.stacked .sub{white-space:normal}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none}
  .caps{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .cap{width:auto;white-space:nowrap;flex:none}
  .cap .n{display:none}
}
@media (prefers-reduced-motion:no-preference){.cap,.sty,.ib{transition:background-color .12s,border-color .12s}}
</style>

const I=n=>{const x=ICONS[n]||["0 0 1 1",""];return `<svg class="ic" viewBox="${x[0]}" aria-hidden="true">${x[1]}</svg>`};
let state={cap:'projects',mode:'topS',show:'s1',view:'detailed'};
try{const s=JSON.parse(localStorage.getItem('plx-hdr')||'{}');Object.assign(state,s)}catch(e){}
const save=()=>{try{localStorage.setItem('plx-hdr',JSON.stringify(state))}catch(e){}};

function avatar(a,mode,kind){
  const s=SIZES[kind][mode],stretch=mode==='colL'||mode==='edge';
  const tone=a.tone||'gray';
  /* always square: stretched avatars take the row height, then size() sets the width to match */
  let st=`width:${s}px;`+(stretch?`align-self:stretch;min-height:${s}px;`:`height:${s}px;`)+(mode==='colS'?'align-self:flex-start;':'');
  let cls='av'+(mode==='edge'?' edge':'')+(stretch?' sq':''),inner='';
  const g=Math.round(s*(stretch?0.36:0.5));
  if(a.t==='icon'){cls+=' '+tone;inner=`<span style="font-size:${g}px">${I(a.i)}</span>`}
  else if(a.t==='initials'){cls+=' '+tone;inner=`<span style="font-size:${Math.round(s*(stretch?0.26:0.32))}px">${esc(a.x)}</span>`}
  else if(a.t==='file'){cls+=' '+tone;inner=`<span style="font-size:${Math.max(11,Math.round(s*(stretch?0.18:0.25)))}px">${esc(a.x)}</span>`}
  else if(a.t==='thumb'){cls+=' thumb neutral';inner=`<span style="font-size:${g}px">${I(a.i)}</span>`}
  else if(a.t==='group'){cls+=stretch?' neutral':'';const c=Math.round(s*(stretch?0.5:0.68)),o=stretch?'14%':'0',f=Math.max(11,Math.round(c*0.36));
    inner=`<span class="ini blue" style="width:${c}px;height:${c}px;font-size:${f}px;left:${o};top:${o}">${esc(a.a)}</span><span class="ini b green" style="width:${c}px;height:${c}px;font-size:${f}px;right:${o};bottom:${o}">${esc(a.b)}</span>`}
  return `<div class="${cls}" style="${st}">${inner}</div>`;
}
const btn=([i,l])=>`<button class="ib" type="button" aria-label="${esc(l)}" title="${esc(l)}">${I(i)}</button>`;
function layout(mode,av,text,below){
  return mode.startsWith('top')
   ?`<div class="lc body"><div class="hd">${av}${text}</div>${below}</div>`
   :`<div class="lc split">${av}<div class="body"><div class="hd">${text}</div>${below}</div></div>`;
}
function pageHeader(c,mode){
  const text=`<div class="tx"><h3 class="ttl">${esc(c.title)}</h3><p class="sub">${esc(c.sub)}</p></div>`;
  const [tone,si,sl]=c.status;
  const facts=`<div class="facts"><div class="st-tile st-${tone}"><p class="lbl">Status</p><p class="val"><span class="pill ${tone}">${I(si)}${esc(sl)}</span></p></div>`+
    c.facts.map(([l,v,m])=>`<div><p class="lbl">${esc(l)}</p><p class="val${m?' mono':''}">${esc(v)}</p></div>`).join('')+`</div>`;
  const right=`<div class="rc"><div class="nx"><p class="lbl eyebrow">Next step</p><p class="nt">${esc(c.next[0])}</p><p class="sub">${esc(c.next[1])}</p></div><div class="acts">${c.actions.map(btn).join('')}</div></div>`;
  return `<article class="hdr" aria-label="${esc(c.name)} page header">${layout(mode,avatar(c.av,mode,'page'),text,'<div class="rule"></div>'+facts)}${right}</article>`;
}
function sectionHeader(c,s,mode){
  const a={t:'icon',i:s.i,tone:c.av.tone||'gray'};
  const text=`<div class="tx"><h4 class="ttl">${esc(s.title)}</h4></div>`;
  const right=s.actions?`<div class="rc"><div class="acts">${s.actions.map(btn).join('')}</div></div>`:'';
  return `<article class="hdr sec${s.actions?'':' solo'}" aria-label="${esc(s.title)} section header">${layout(mode,avatar(a,mode,'sec'),text,`<div class="rule"></div><p class="sub after">${esc(s.sub)}</p>`)}${right}</article>`;
}
function wire(id){
  const L=id.startsWith('top')
   ?`<div class="wc"><div class="wr"><i class="wi"></i><span class="wt"><i></i><i></i></span></div><i class="wb"></i><span class="wf2"><i></i><i></i><i></i></span></div>`
   :`<i class="wi"></i><div class="wc" style="justify-content:center"><span class="wt"><i></i><i></i></span><i class="wb"></i><span class="wf2"><i></i><i></i><i></i></span></div>`;
  return `<div class="wf wf-${id}" aria-hidden="true"><div class="wl">${L}</div><div class="wd"></div><div class="wrc"><i class="l1"></i><span class="bt"><i></i><i></i><i></i></span></div></div>`;
}

const PILL = {green:'success',blue:'active',amber:'waiting',red:'negative',gray:'neutral'};
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const badge = ([tone,icon,label]) => tone==='mono'
  ? `<span class="s2-mono">${esc(label)}</span>`
  : `<span class="s2-badge b-${tone==='amber'?'waiting':tone}">${icon?I(icon):''}${esc(label)}</span>`;
const sBtn = ([i,l],kind) => kind==='icon'
  ? `<button class="s2-btn icon" type="button" data-act="${esc(l)}" aria-label="${esc(l)}" title="${esc(l)}"${/^(Favorite|Pin)$/.test(l)?' aria-pressed="false"':''}>${I(i)}</button>`
  : `<button class="s2-btn ${kind}" type="button" data-act="${esc(l)}">${I(i)}<span>${esc(l)}</span></button>`;
function s2Avatar(c,x,kind){
  if(kind==='sec') return `<div class="s2-av t-${c.av.tone||'gray'}">${I(x.i)}</div>`;
  const o=(S2[c.id]||{}).avatar;
  if(o==='none') return '';
  if(o==='hash') return `<div class="s2-av hash">#</div>`;
  if(o==='check') return `<button class="s2-check" type="button" data-act="Mark done" aria-pressed="false" aria-label="Mark done">${I('check')}</button>`;
  if(o&&o.startsWith('photo:')) return `<div class="s2-av"><img src="${PHOTOS[o.slice(6)]}" alt=""></div>`;
  const a=c.av,t=a.tone||'gray';
  if(a.t==='icon') return `<div class="s2-av t-${t}">${I(a.i)}</div>`;
  if(a.t==='initials') return `<div class="s2-av t-${t}">${esc(a.x)}</div>`;
  if(a.t==='file') return `<div class="s2-av file t-${t}">${I('picture_as_pdf')}<span>${esc(a.x)}</span></div>`;
  if(a.t==='thumb') return `<div class="s2-av t-gray">${I(a.i)}</div>`;
  if(a.t==='group') return `<div class="s2-av t-gray"><span class="mini t-blue" style="left:3px;top:3px">${esc(a.a)}</span><span class="mini t-green" style="right:3px;bottom:3px">${esc(a.b)}</span></div>`;
  return '';
}
function people(p){
  if(!p) return '';
  return `<div class="s2-people">${p.list.map(k=>`<img src="${PHOTOS[k]}" alt="">`).join('')}<button class="more" type="button" data-act="Invite people" aria-label="${esc(p.more)} more people">${esc(p.more)}</button></div>`;
}
function detail(d){
  if(!d) return '';
  const it=([i,t,tone])=>`<span class="it${tone==='success'?' ok':tone==='warning'?' warn':''}">${I(i)}${esc(t)}</span>`;
  let h='';
  if(d.t==='progress') h=`<div class="s2-prog"><div class="row"><span>${esc(d.label)}</span><b>${esc(d.value)}</b></div><div class="trk"><i style="width:${d.pct}%"></i></div><div class="s2-tiles">${d.tiles.map(([l,v,tone])=>`<div class="s2-tile${tone==='success'?' st-ok':tone==='warning'?' st-warn':''}"><small>${esc(l)}</small><b>${esc(v)}</b></div>`).join('')}</div></div>`;
  else if(d.t==='tags') h=d.tags.map(([l,b])=>`<span class="s2-tag${b?' brand':''}">${esc(l)}</span>`).join('')+`<span class="grow">${it(d.meta)}</span>`;
