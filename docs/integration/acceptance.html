<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plenix CDN acceptance</title>
<!-- A standalone page on the CDN release it sits in (/cdn/<version>/examples/acceptance.html): only that release's files.
     It exercises what CTM's report of 2026-10-22 asks to check: DataGrid densities, pills, uniform pill widths, wrapped
     headers with hover and resize, icon names with dashes and underscores, and right to left. -->
<link rel="stylesheet" href="../plenix.css">
<link rel="stylesheet" href="../icons-all.css">
<script src="../theme-boot.js"></script>
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../plenix.js"></script>
<script src="../plenix-engines.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement, P = window.Plenix;
const people = [['Michael Hanna', 'male'], ['Marina Abdel-Malik', 'female'], ['Peter Tawfik', 'male'], ['Irene Girgis', 'female'], ['Samuel Boulos', 'male'], ['Martha Saad', 'female']];
const rows = people.map((p, i) => ({ id: i + 1, n: '20261020-0' + (i + 1), who: { name: p[0], gender: p[1] }, date: '2026-10-' + (20 + i), amount: [5, 1250, 42, 9, 300, 77][i], status: ['Open', 'Closed', 'Adjourned', 'Open', 'In session', 'Closed'][i] }));
const cols = [{ title: 'Case number', field: 'n', kind: 'data' }, { title: 'Assigned case manager', field: 'who', type: 'person', width: '--plx-ref-size-120px' }, { title: 'Next hearing date', field: 'date', type: 'date' }, { title: 'Amount', field: 'amount', type: 'number' }, { title: 'Status', field: 'status' }];
const icons = ['person-cancel', 'person_cancel', 'document-search', 'document_search', 'folder-eye', 'folder_eye', 'mic-off', 'mic_off', 'check-square', 'edit', 'rocket_launch'];
function App() {
  const [rtl, setRtl] = React.useState(false);
  React.useEffect(() => { document.documentElement.dir = rtl ? 'rtl' : 'ltr'; }, [rtl]);
  return h(P.Stack, { gap: 'section', inset: 'lg' },
    h(P.Stack, { gap: 'sm' }, h(P.Heading, { level: 1 }, 'Plenix CDN acceptance'),
      h(P.Text, null, 'Hover a header: its whole title stays readable. Drag or use the arrow keys on a column edge to resize. Each pill column shares one width.'),
      h(P.Inline, null, h(P.Switch, { label: 'Right to left', checked: rtl, onChange: (e) => setRtl(e.target.checked) }))),
    ['compact', 'standard', 'comfortable'].map((d) => h(P.Stack, { gap: 'sm', key: d }, h(P.SectionHeading, { level: 2 }, d + ' (wrapped headers, uniform pills)'),
      h(P.DataGrid, { label: 'Cases, ' + d, density: d, cells: 'pill', wrapHeaders: true, columns: cols, data: rows }))),
    h(P.Stack, { gap: 'sm' }, h(P.SectionHeading, { level: 2 }, 'Static table'), h(P.Table, { label: 'Cases, static', columns: cols, data: rows })),
    h(P.Stack, { gap: 'sm' }, h(P.SectionHeading, { level: 2 }, 'Icon names (dashes, underscores, the whole library)'),
      h(P.Inline, { wrap: true, gap: 'md' }, icons.map((n) => h(P.Inline, { key: n, gap: 'xs' }, h(P.Icon, { name: n }), h(P.Text, { variant: 'data' }, n))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
