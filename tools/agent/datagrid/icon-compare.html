<!doctype html>
<html lang="en" data-plx-density="compact"><head><meta charset="utf-8"><title>Icon compare</title>
<link rel="stylesheet" href="../../../platform/platform.css">
<script src="../../../platform/vendor/react.production.min.js"></script>
<script src="../../../platform/vendor/react-dom.production.min.js"></script>
<script src="../../../platform/dist/platform.js"></script>
<style>body{background:var(--plx-ref-color-gray-50);margin:0;color:var(--plx-ref-color-gray-900);}.wall{display:flex;flex-wrap:wrap;gap:var(--plx-ref-space-4px);padding:var(--plx-ref-space-8px);}</style>
</head><body><div id="root"></div>
<script>
// Icon compare (icon-compare.js drives it): every Plenix icon name at each size, outline and filled, in a Compact and a
// Comfortable region, so the mask drawing (a baseline build) and the inline drawing can be compared pixel by pixel.
const h = React.createElement, P = window.Plenix, q = new URLSearchParams(location.search);
const names = (window.__names = []);
fetch('../../../platform/icons/map.json').then((r) => r.json()).then((m) => {
  const all = Object.keys(m.map).sort(), part = q.get('part') || '0', per = 70, list = all.slice(per * Number(part), per * (Number(part) + 1));
  names.push(...list);
  const size = q.get('size') || 'md', density = q.get('density') || 'compact', filled = q.get('filled') === '1';
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { 'data-plx-density': density, className: 'wall', id: 'wall' },
    list.map((n) => h(P.Icon, { key: n, name: n, size: size === 'auto' ? undefined : size, filled }))));
  window.__ready = true;
});
</script></body></html>
